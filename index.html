<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما ستارز | Cinema Stars TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* تحسين استجابة الصور */
        .poster-img { aspect-ratio: 2/3; object-fit: cover; width: 100%; border-radius: 12px; transition: all 0.3s ease; }

        /* تأثير التركيز للريموت كنترول (TV) ولوحة المفاتيح */
        .movie-card:focus { outline: 4px solid var(--main-red); transform: scale(1.1); z-index: 50; border-radius: 12px; }
        
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { display: none; }

        /* تنسيق الفيديو ليكون ملء الشاشة تماماً في التلفاز */
        .video-wrapper { position: fixed; inset: 0; background: black; z-index: 1000; display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* لمسات جمالية للخلفية */
        .hero-gradient { background: linear-gradient(to top, var(--bg-dark) 10%, transparent 50%, rgba(0,0,0,0.8) 100%); }
    </style>
</head>
<body class="selection:bg-red-600">

    <!-- القائمة العلوية - متجاوبة -->
    <nav class="fixed top-0 w-full z-[100] px-6 py-4 flex justify-between items-center bg-gradient-to-b from-black to-transparent">
        <div class="text-2xl md:text-4xl font-extrabold text-red-600 tracking-tighter">CINEMA STARS</div>
        <div class="flex items-center gap-4">
            <input type="text" id="searchInput" placeholder="ابحث..." 
                class="bg-black/50 border border-gray-600 rounded-full px-4 py-2 text-sm focus:w-64 md:w-48 transition-all outline-none focus:border-red-600 focus:bg-black">
        </div>
    </nav>

    <!-- الهيرو (الفيلم الرئيسي) - تصميم 10ft UI -->
    <header id="hero" class="relative h-[80vh] md:h-screen flex items-end p-8 md:p-20 overflow-hidden">
        <div class="z-10 max-w-4xl mb-10">
            <h1 id="heroTitle" class="text-4xl md:text-7xl font-extrabold mb-4 leading-tight">...</h1>
            <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 md:line-clamp-4 max-w-2xl">...</p>
            <div class="flex gap-4">
                <button id="heroPlayBtn" class="bg-red-600 hover:bg-white hover:text-black text-white px-10 py-4 rounded-xl font-extrabold transition-all transform hover:scale-105 text-lg md:text-2xl">
                    ▶ شـاهد الآن
                </button>
            </div>
        </div>
        <div class="absolute inset-0 z-0">
            <img id="heroImg" src="" class="w-full h-full object-cover opacity-60 transition-opacity duration-1000">
            <div class="absolute inset-0 hero-gradient"></div>
        </div>
    </header>

    <!-- قائمة الأفلام - Grid ذكي لجميع الأجهزة -->
    <main class="p-6 md:p-20 -mt-20 relative z-20">
        <h2 id="gridTitle" class="text-2xl md:text-4xl font-bold mb-8 text-white/90">الأفلام الرائجة</h2>
        
        <!-- Grid متجاوب: 2 موبايل، 4 تابلت، 6 لابتوب/تلفاز -->
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-8">
            <!-- الأفلام هنا -->
        </div>
    </main>

    <!-- مشغل الفيديو - ملء الشاشة (Full Screen) -->
    <div id="videoModal" class="video-wrapper">
        <button onclick="closeVideo()" class="absolute top-8 left-8 z-[1100] bg-red-600 text-white w-12 h-12 rounded-full text-2xl font-bold shadow-2xl hover:scale-110 transition">&times;</button>
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_PATH = 'https://image.tmdb.org/t/p/original';
        
        // جلب الأفلام
        async function fetchMovies(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                displayMovies(data.results);
                if (data.results[0]) updateHero(data.results[0]);
            } catch (err) { console.error("Error fetching data"); }
        }

        // عرض الأفلام مع إضافة خاصية الـ Focus للتلفاز
        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach((movie, index) => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card group cursor-pointer transition-all duration-300 transform outline-none focus:relative';
                card.tabIndex = "0"; // تسمح بالتركيز باستخدام أزرار الريموت
                
                card.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl shadow-lg border-2 border-transparent group-hover:border-red-600 transition-all">
                        <img src="${IMG_PATH + movie.poster_path}" class="poster-img" alt="${movie.title}">
                        <div class="absolute bottom-0 p-2 bg-gradient-to-t from-black to-transparent w-full">
                           <div class="text-yellow-400 font-bold text-xs md:text-sm">★ ${movie.vote_average.toFixed(1)}</div>
                        </div>
                    </div>
                    <h3 class="mt-2 text-[10px] md:text-sm font-bold truncate text-center group-hover:text-red-500">${movie.title}</h3>
                `;
                
                // تشغيل الفيديو عند الضغط أو ضغط زر "OK" في الريموت
                const play = () => openVideo(movie.id);
                card.onclick = play;
                card.addEventListener('keydown', (e) => { if(e.key === 'Enter') play(); });
                
                grid.appendChild(card);
            });
        }

        function updateHero(movie) {
            document.getElementById('heroImg').src = IMG_PATH + movie.backdrop_path;
            document.getElementById('heroTitle').innerText = movie.title;
            document.getElementById('heroDesc').innerText = movie.overview;
            document.getElementById('heroPlayBtn').onclick = () => openVideo(movie.id);
        }

        function openVideo(id) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = `https://vidsrc.me/embed/movie?tmdb=${id}`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = '';
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // البحث (يعمل مع لوحة مفاتيح التلفاز الشاشات الذكية)
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && searchInput.value !== '') {
                fetchMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${searchInput.value}&language=ar-SA`);
                document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${searchInput.value}`;
                window.scrollTo(0, 500);
            }
        });

        // البداية: جلب الأفلام الشائعة
        fetchMovies(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA&page=1`);
    </script>
</body>
</html>
