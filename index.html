<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | عالمك السينمائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }

        /* صفحة التفاصيل */
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; }
        
        /* تأثير Ambient Glow للمشغل */
        .video-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            box-shadow: 0 0 50px rgba(229, 9, 20, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .episode-card, .movie-card { transition: 0.3s; cursor: pointer; }
        .episode-card:hover, .movie-card:hover { transform: scale(1.05); border-color: var(--main-red); }

        .glass-nav { background: rgba(5, 8, 17, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-red); color: white; padding: 0 8px; border-radius: 8px; margin-right: 5px; }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[100] px-6 md:px-12 py-4 flex justify-between items-center glass-nav">
        <div class="flex items-center gap-8">
            <div class="text-2xl font-black cursor-pointer" onclick="location.reload()">
                <span class="text-white">SbaTa</span><span class="logo-tv">Tv</span>
            </div>
            <div class="hidden md:flex gap-8 text-sm font-bold">
                <button onclick="changeType('movie')" id="btn-movie" class="text-red-600 transition">أفلام</button>
                <button onclick="changeType('tv')" id="btn-tv" class="text-gray-400 hover:text-red-600 transition">مسلسلات</button>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث في SbaTa Tv..." class="bg-white/10 border border-white/20 rounded-full px-5 py-2 text-sm outline-none focus:border-red-600 w-40 md:w-72">
    </nav>

    <!-- الصفحة الرئيسية -->
    <div id="homePage">
        <header class="relative h-[80vh] flex items-center p-8 md:p-20 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-50">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-5xl md:text-8xl font-black mb-6">...</h1>
                <p id="heroDesc" class="text-gray-300 text-lg md:text-2xl mb-10 line-clamp-3">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-12 py-4 rounded-xl font-black text-xl hover:scale-110 transition shadow-2xl">▶ شاهد الآن</button>
            </div>
        </header>
        <main class="px-6 md:px-20 pb-20 mt-10">
            <h2 id="gridTitle" class="text-2xl md:text-4xl font-black mb-10 border-r-8 border-red-600 pr-4">الأكثر رواجاً</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-6"></div>
        </main>
    </div>

    <!-- صفحة تفاصيل المسلسل -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-8 left-8 z-[210] bg-white/10 p-4 rounded-full text-2xl font-bold">&times;</button>
        <div class="relative h-[60vh] flex items-end p-10">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center">
                <img id="detailPoster" src="" class="w-56 rounded-2xl shadow-2xl border-4 border-white/5">
                <div class="text-right">
                    <h1 id="detailTitle" class="text-4xl md:text-6xl font-black mb-4">...</h1>
                    <p id="detailStory" class="text-gray-300 text-lg max-w-4xl leading-relaxed">...</p>
                </div>
            </div>
        </div>
        <div class="px-10 mt-10">
            <h3 class="text-2xl font-bold mb-6 text-red-500">المواسم</h3>
            <div id="seasonsBar" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
            <h3 class="text-2xl font-bold mt-10 mb-6">الحلقات</h3>
            <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>
    </div>

    <!-- صفحة مشغل الفيديو الاحترافية -->
    <div id="playerPage" class="fade-in">
        <nav class="p-6 flex items-center gap-4 bg-black/40">
            <button onclick="closePlayer()" class="bg-white/10 p-2 px-4 rounded-lg font-bold hover:bg-red-600 transition">← العودة</button>
            <h2 id="playerTitle" class="text-xl font-bold truncate text-red-500">اسم الفيلم</h2>
        </nav>

        <div class="flex flex-col lg:flex-row gap-8 p-6 md:p-10">
            <!-- منطقة الفيديو -->
            <div class="lg:w-3/4">
                <div class="video-container aspect-video shadow-[0_0_80px_rgba(229,9,20,0.15)]">
                    <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
                </div>
                <div class="mt-8 bg-white/5 p-6 rounded-2xl border border-white/10">
                    <div class="flex justify-between items-start mb-4">
                        <h1 id="playerSubTitle" class="text-3xl font-black">...</h1>
                        <div class="flex items-center gap-2 text-yellow-500 font-bold">⭐ <span id="playerRate">0.0</span></div>
                    </div>
                    <p id="playerDesc" class="text-gray-400 text-lg leading-relaxed italic">...</p>
                </div>
            </div>

            <!-- الجانب: أفلام مقترحة -->
            <div class="lg:w-1/4">
                <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><span class="w-1 h-6 bg-red-600 block"></span> قد يعجبك أيضاً</h3>
                <div id="recommendationsGrid" class="flex flex-col gap-6">
                    <!-- مقترحات -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const IMG_W500 = 'https://image.tmdb.org/t/p/w500';
        
        let currentType = 'movie'; 
        let globalBackdrop = '';

        async function fetchContent(url) {
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results);
            if(data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'group cursor-pointer transition transform hover:scale-110';
                card.onclick = () => openItem(item);
                card.innerHTML = `
                    <div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-xl border-2 border-transparent group-hover:border-red-600 transition-all">
                        <img src="${IMG_W500 + item.poster_path}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-red-600 text-3xl">▶</div>
                    </div>
                    <h3 class="mt-3 text-xs font-bold truncate text-center">${item.title || item.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = IMG_URL + item.backdrop_path;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroDesc').innerText = item.overview;
            document.getElementById('heroPlayBtn').onclick = () => openItem(item);
        }

        function openItem(item) {
            if(currentType === 'movie') {
                openPlayer(item.id, item.title, item.overview, item.vote_average);
            } else {
                showTVDetails(item.id);
            }
        }

        // --- صفحة المشغل الاحترافية ---
        async function openPlayer(id, title, desc, rate) {
            const playerPage = document.getElementById('playerPage');
            const iframe = document.getElementById('videoPlayer');
            
            iframe.src = currentType === 'movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}`;
            
            document.getElementById('playerTitle').innerText = `أنت تشاهد الآن: ${title}`;
            document.getElementById('playerSubTitle').innerText = title;
            document.getElementById('playerDesc').innerText = desc || "لا يوجد وصف متاح لهذا العمل.";
            document.getElementById('playerRate').innerText = rate.toFixed(1);

            playerPage.style.display = 'block';
            document.body.style.overflow = 'hidden';

            // جلب مقترحات
            fetchRecommendations(id);
        }

        async function fetchRecommendations(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}/similar?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '';
            data.results.slice(0, 6).forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex gap-4 cursor-pointer group hover:bg-white/5 p-2 rounded-xl transition';
                row.onclick = () => {
                    closePlayer();
                    setTimeout(() => openItem(item), 100);
                };
                row.innerHTML = `
                    <img src="${IMG_W500 + item.poster_path}" class="w-20 rounded-lg shadow-lg">
                    <div class="flex flex-col justify-center">
                        <h4 class="text-sm font-bold group-hover:text-red-500 transition line-clamp-1">${item.title || item.name}</h4>
                        <span class="text-xs text-gray-500 mt-1">⭐ ${item.vote_average.toFixed(1)}</span>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        async function showTVDetails(tvId) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            globalBackdrop = data.backdrop_path;
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailBg').src = IMG_URL + data.backdrop_path;
            document.getElementById('detailPoster').src = IMG_W500 + data.poster_path;
            document.getElementById('detailTitle').innerText = data.name;
            document.getElementById('detailStory').innerText = data.overview;

            const bar = document.getElementById('seasonsBar');
            bar.innerHTML = '';
            data.seasons.forEach(s => {
                if(s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = `season-btn season-nav-${s.season_number}`;
                btn.innerText = s.name;
                btn.onclick = (e) => {
                    document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    loadEpisodes(tvId, s.season_number, data.name);
                };
                bar.appendChild(btn);
            });
            document.querySelector('.season-nav-1')?.click();
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const epImg = ep.still_path ? (IMG_W500 + ep.still_path) : (IMG_W500 + globalBackdrop);
                grid.innerHTML += `
                    <div class="episode-card" onclick="openTVPlayer(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - حلقة ${ep.episode_number}', '${ep.overview}')">
                        <div class="relative aspect-video rounded-xl overflow-hidden">
                            <img src="${epImg}" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 right-2 bg-red-600 px-2 py-1 rounded text-[10px] font-bold">الحلقة ${ep.episode_number}</div>
                        </div>
                        <h4 class="mt-2 text-xs font-bold truncate">${ep.name}</h4>
                    </div>
                `;
            });
        }

        function openTVPlayer(id, s, e, title, desc) {
            const url = `https://vidsrc.to/embed/tv/${id}/${s}/${e}`;
            openPlayer(id, title, desc, 8.5);
            document.getElementById('videoPlayer').src = url;
        }

        function closePlayer() {
            document.getElementById('playerPage').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = 'auto';
        }

        function closeDetails() { document.getElementById('detailPage').style.display = 'none'; }

        function changeType(type) {
            currentType = type;
            document.getElementById('btn-movie').className = type === 'movie' ? 'text-red-600 font-black' : 'text-gray-400';
            document.getElementById('btn-tv').className = type === 'tv' ? 'text-red-600 font-black' : 'text-gray-400';
            fetchContent(`${BASE_URL}/${type}/popular?api_key=${API_KEY}&language=ar-SA`);
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && e.target.value !== '') {
                fetchContent(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${e.target.value}&language=ar-SA`);
            }
        });

        fetchContent(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA`);
    </script>
</body>
</html>
