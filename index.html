<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | AI & ReelShort Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* Dropdowns */
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(25px); border: 1px solid rgba(229, 9, 20, 0.4); border-radius: 15px; min-width: 200px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); z-index: 1000; }
        .group:hover .dropdown-content { display: block; animation: fadeIn 0.3s ease; }
        .dropdown-item { padding: 12px 20px; display: block; font-size: 14px; font-weight: 700; color: #bbb; transition: 0.3s; text-align: right; border-right: 4px solid transparent; }
        .dropdown-item:hover { background: rgba(229, 9, 20, 0.15); color: white; border-right-color: var(--main-red); padding-right: 25px; }

        /* المشغل الذكي */
        .video-container { position: relative; width: 100%; background: #000; border-radius: 24px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.05); transition: 0.5s; }
        .ratio-16-9 { aspect-ratio: 16 / 9; }
        .ratio-9-16 { aspect-ratio: 9 / 16; max-width: 400px; margin: 0 auto; } 

        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .movie-card { transition: 0.4s; cursor: pointer; flex-shrink: 0; }
        .movie-card:hover { transform: translateY(-8px) scale(1.03); }
        .logo-tv { background: var(--main-red); color: white; padding: 2px 8px; border-radius: 6px; margin-right: 5px; font-style: italic; }
        .glass-nav { background: rgba(5, 8, 17, 0.97); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 z-[300] bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center opacity-0 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[100] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter" onclick="location.reload()"><span class="text-white italic">SbaTa</span><span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-red-600 transition text-sm md:text-lg">أفلام ▾</button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('movie', '')" class="dropdown-item">✨ التريند والأحدث</a>
                        <a href="#" onclick="changeType('ai', '')" class="dropdown-item">🤖 أفلام الذكاء الاصطناعي</a>
                        <a href="#" onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 أفلام عربية</a>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-red-600 transition text-sm md:text-lg">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('tv', '')" class="dropdown-item">✨ مسلسلات 2026</a>
                        <a href="#" onclick="changeType('reel', '')" class="dropdown-item">📱 دراما قصيرة (ReelShort)</a>
                        <a href="#" onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 مسلسلات عربية</a>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث في SbaTa Tv..." class="bg-white/10 border border-white/20 rounded-full px-6 py-1.5 text-sm outline-none focus:border-red-600 w-full md:w-80 text-white font-bold">
    </nav>

    <!-- Main Page -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[70vh] flex items-end p-8 md:p-20 pb-16 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-opacity">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-4xl md:text-7xl font-black mb-4 uppercase italic drop-shadow-2xl">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-10 py-3 rounded-2xl font-black text-lg md:text-2xl hover:scale-110 shadow-2xl transition-all">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-6 md:px-20 pb-20 -mt-10 relative z-20">
            <section id="comingSoonSection" class="mb-14">
                <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-500 uppercase">Coming Soon 🔥</h2>
                <div id="comingSoonGrid" class="flex gap-5 overflow-x-auto no-scrollbar pb-4"></div>
            </section>
            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-red-600 pr-6 italic uppercase tracking-widest">TRENDING NOW</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4 md:gap-8"></div>
            <div id="loadMoreArea" class="flex justify-center mt-12"><button onclick="loadNextPage()" class="bg-white/5 border border-white/10 text-white px-10 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- Detail Page -->
    <div id="detailPage" class="fade-in pb-20 text-right">
        <button onclick="closeDetails()" class="fixed top-20 left-4 z-[210] bg-white/10 p-3 rounded-full text-xl font-bold backdrop-blur-md hover:bg-red-600 transition">&times;</button>
        <div class="relative min-h-[55vh] flex items-end p-8 md:p-20">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-20">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
            <div class="relative z-10 flex flex-col md:flex-row gap-8 items-center w-full">
                <img id="detailPoster" src="" class="w-48 md:w-64 rounded-3xl shadow-2xl border-4 border-white/5" onerror="this.src='https://via.placeholder.com/500x750?text=SbaTa+Tv'">
                <div class="max-w-4xl text-right">
                    <h1 id="detailTitle" class="text-3xl md:text-6xl font-black mb-4 uppercase italic">...</h1>
                    <p id="detailStory" class="text-gray-200 text-sm md:text-lg leading-relaxed italic font-bold mb-8">...</p>
                    <button id="detailPlayBtn" class="bg-red-600 text-white px-10 py-3 rounded-xl font-black text-lg">▶ مشاهدة الآن</button>
                </div>
            </div>
        </div>
        <div class="px-8 md:px-20 mt-12" id="castArea"></div>
    </div>

    <!-- Player Page -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/50 backdrop-blur-md sticky top-0 z-[250] border-b border-white/5">
            <button onclick="closePlayer()" class="bg-red-600 px-4 py-1.5 rounded-xl font-black text-sm transition">← العودة</button>
            <h2 id="playerTitle" class="text-xs md:text-xl font-bold truncate text-white uppercase px-4 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <div id="serverList" class="flex gap-2 mb-4 overflow-x-auto no-scrollbar font-bold"></div>
            <div id="playerContainer" class="video-container ratio-16-9 mb-10">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="bg-white/5 p-6 md:p-10 rounded-[40px] border border-white/10 text-right font-bold italic">
                <h1 id="pSubTitle" class="text-xl md:text-4xl font-black mb-4 uppercase">...</h1>
                <p id="pDesc" class="text-gray-400 text-sm md:text-xl leading-relaxed">...</p>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';

        // --- قاعدة بيانات مصلحة لأفلام AI و ReelShort (روابط صور تعمل) ---
        const customLibrary = {
            ai: [
                { id: 'ai1', title: 'THE GENESIS: AI WORLD', overview: 'أول فيلم ذكاء اصطناعي متكامل يصور نشأة العالم الرقمي.', poster_path: 'https://images.unsplash.com/photo-1620712943543-bcc4628c9759?w=500&q=80', video_url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 'ai2', title: 'CYBERPUNK DREAM', overview: 'رحلة بصرية داخل أحلام الآلات في المستقبل.', poster_path: 'https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=500&q=80', video_url: 'https://www.youtube.com/embed/example2' }
            ],
            reel: [
                { id: 'rs1', title: 'FATED TO MY ALPHA', overview: 'دراما ReelShort المترجمة: قصة حب مستحيلة في عالم المستذئبين.', poster_path: 'https://m.media-amazon.com/images/M/MV5BMjA4NzUyNjc1MV5BMl5BanBnXkFtZTgwNjE2MDY0NjM@._V1_QL75_UX280_CR0,0,280,414_.jpg', video_url: 'https://www.youtube.com/embed/6_9C36C3-00', isVertical: true },
                { id: 'rs2', title: 'BILLIONAIRE SECRET', overview: 'مسلسل قصير عمودي يحكي قصة زواج سري من مليونير.', poster_path: 'https://m.media-amazon.com/images/M/MV5BNzQ2MzE3MTYtZGE4YS00YTM4LWI2MzctYmU0X2Y3MzU1ZGU0XkEyXkFqcGdeQXVyMTEyMjM2NDc2._V1_QL75_UX280_CR0,0,280,414_.jpg', video_url: 'https://www.youtube.com/embed/example3', isVertical: true }
            ]
        };

        let currentType = 'movie'; 
        let currentPage = 1;
        let currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };

        async function fetchComingSoon() {
            const res = await fetch(`${BASE_URL}/movie/upcoming?api_key=${API_KEY}&language=ar-SA&page=1`);
            const data = await res.json();
            const grid = document.getElementById('comingSoonGrid');
            grid.innerHTML = '';
            data.results.forEach(item => {
                grid.innerHTML += `<div class="movie-card w-32 md:w-44" onclick="showDetailsTmdb(${item.id})"><div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-lg border border-white/5"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div><h4 class="mt-2 text-[9px] font-bold text-center uppercase truncate">${item.original_title}</h4></div>`;
            });
        }

        async function fetchContent(isAppend = false) {
            if(currentType === 'ai' || currentType === 'reel') {
                displayGrid(customLibrary[currentType], false);
                document.getElementById('loadMoreArea').style.display = 'none';
                return;
            }
            document.getElementById('loadMoreArea').style.display = 'flex';
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&sort_by=popularity.desc&page=${currentPage}`;
            if (currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHeroTmdb(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid');
            if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                const img = item.poster_path.startsWith('http') ? item.poster_path : IMG_URL + item.poster_path;
                const title = item.original_title || item.original_name || item.title;
                const card = document.createElement('div');
                card.className = 'movie-card group fade-in';
                card.onclick = () => item.video_url ? showDetailsCustom(item) : showDetailsTmdb(item.id);
                card.innerHTML = `<div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-2xl border-2 border-transparent group-hover:border-red-600 transition-all"><img src="${img}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700" onerror="this.src='https://via.placeholder.com/500x750?text=SbaTa+Tv'"></div><h3 class="mt-3 text-[10px] font-bold truncate text-center uppercase px-1 italic">${title}</h3>`;
                grid.appendChild(card);
            });
        }

        function updateHeroTmdb(item) {
            document.getElementById('heroImg').src = IMG_ORG + (item.backdrop_path || item.poster_path);
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "Exclusive content on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetailsTmdb(item.id);
        }

        async function showDetailsTmdb(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits`);
            const data = await res.json();
            fillDetails(data.original_title || data.original_name || data.title, data.overview, data.backdrop_path, data.poster_path, () => setupServers(id, data.original_title || data.title));
            document.getElementById('castArea').innerHTML = `<h3 class="text-2xl font-black mb-6 uppercase"><span class="w-1.5 h-6 bg-blue-600 block"></span> Top Cast</h3><div class="flex gap-4 overflow-x-auto no-scrollbar">${data.credits.cast.slice(0, 10).map(c => `<div class="text-center w-24 shrink-0"><img src="${c.profile_path?IMG_W500+c.profile_path:'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-full mx-auto object-cover border-2 border-red-600"><p class="text-[9px] mt-2 font-bold">${c.name}</p></div>`).join('')}</div>`;
        }

        function showDetailsCustom(item) {
            fillDetails(item.title, item.overview, null, item.poster_path, () => openPlayer(item.video_url, item.title, item.overview, item.isVertical));
            document.getElementById('castArea').innerHTML = '';
        }

        function fillDetails(title, desc, bg, poster, playAction) {
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailPage').scrollTo(0,0);
            document.getElementById('detailBg').src = bg ? IMG_ORG + bg : poster;
            document.getElementById('detailPoster').src = poster.startsWith('http') ? poster : IMG_W500 + poster;
            document.getElementById('detailTitle').innerText = title;
            document.getElementById('detailStory').innerText = desc || "No description available.";
            document.getElementById('detailPlayBtn').onclick = playAction;
        }

        function openPlayer(url, title, desc, isVertical) {
            const page = document.getElementById('playerPage');
            const container = document.getElementById('playerContainer');
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('pSubTitle').innerText = title;
            document.getElementById('pDesc').innerText = desc || "";
            container.className = isVertical ? "video-container ratio-9-16 mb-10 shadow-[0_0_80px_rgba(229,9,20,0.4)]" : "video-container ratio-16-9 mb-10 shadow-[0_0_80px_rgba(229,9,20,0.3)]";
            page.style.display = 'block';
            page.scrollTo(0,0);
            document.body.style.overflow = 'hidden';
        }

        function setupServers(id, title) {
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            const svs = [{n:'S1 (VIP)', u:`https://vidsrc.to/embed/${currentType}/${id}`}, {n:'S2 (Stable)', u:`https://embed.su/embed/${currentType}/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `server-btn ${i===0?'active':''}`; b.innerText = v.n;
                b.onclick = (e) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title, "", false);
        }

        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow='auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; document.getElementById('gridTitle').innerText = t==='ai'?'AI CINEMA':t==='reel'?'REELSHORT DRAMA':'LATEST RELEASES 2026'; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        // البحث المباشر
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value;
            if(q.length > 2) {
                fetch(`${BASE_URL}/search/${currentType === 'ai' || currentType === 'reel' ? 'movie' : currentType}?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(res => res.json()).then(data => displayGrid(data.results, false));
            }
        });

        fetchComingSoon();
        fetchContent();
    </script>
</body>
</html>
