<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | تجربة احترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; }
        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid rgba(255, 255, 255, 0.05); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .movie-card { transition: 0.4s; cursor: pointer; flex-shrink: 0; }
        .movie-card:hover { transform: scale(1.05); }
        .glass-nav { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-red); color: white; padding: 1px 6px; border-radius: 5px; margin-right: 4px; font-style: italic; }
        .server-btn { background: #1a1e2e; padding: 8px 16px; border-radius: 10px; font-weight: 800; transition: 0.3s; color: #9ca3af; font-size: 0.75rem; white-space: nowrap; }
        .server-btn.active { background: var(--main-red); color: white; border: 1px solid white; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 z-[300] bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center opacity-0 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[100] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-6">
            <div class="text-xl md:text-2xl font-black cursor-pointer" onclick="location.reload()"><span class="text-white">SbaTa</span><span class="logo-tv">Tv</span></div>
            <div class="flex gap-4 text-xs md:text-sm font-bold uppercase">
                <div class="group relative">
                    <button class="text-red-600">أفلام ▾</button>
                    <div class="dropdown-content absolute top-full right-0 bg-gray-900 border border-red-600/30 rounded-xl hidden group-hover:block w-40 shadow-2xl">
                        <a onclick="changeType('movie', 'ar')" class="block p-3 hover:bg-red-600 transition">عربية</a>
                        <a onclick="changeType('movie', 'en')" class="block p-3 hover:bg-red-600 transition">أجنبية</a>
                    </div>
                </div>
                <button onclick="changeType('tv', '')" id="btn-tv" class="text-gray-400">مسلسلات</button>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث في SbaTa Tv..." class="bg-white/10 border border-white/20 rounded-full px-5 py-1.5 text-xs md:text-sm outline-none focus:border-red-600 w-full md:w-80 text-white">
    </nav>

    <!-- الصفحة الرئيسية -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[70vh] flex items-end p-6 md:p-20 pb-16 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-opacity">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/20"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-3 italic">...</h1>
                <p id="heroDesc" class="text-gray-300 text-[10px] md:text-lg mb-6 line-clamp-3">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-8 py-2.5 rounded-xl font-black text-sm md:text-xl shadow-2xl transition">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20">
            <!-- قسم قريباً المصلح -->
            <section id="comingSoonSection" class="mb-14">
                <h2 class="text-lg font-black mb-6 flex items-center gap-2 text-yellow-500 underline decoration-red-600">قريباً 🔥</h2>
                <div id="comingSoonGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
            </section>

            <h2 id="gridTitle" class="text-xl md:text-3xl font-black mb-8 border-r-4 border-red-600 pr-4 italic">رائج الآن</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4 md:gap-8"></div>
            <div class="flex justify-center mt-12"><button onclick="loadNextPage()" class="bg-white/5 border border-white/10 text-white px-10 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل المصلحة -->
    <div id="detailPage" class="fade-in pb-20 text-right">
        <button onclick="closeDetails()" class="fixed top-20 left-4 z-[210] bg-white/10 p-3 rounded-full text-xl font-bold">&times;</button>
        <div class="relative h-[55vh] md:h-[65vh] flex items-end p-6 md:p-20">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="relative z-10 flex flex-col md:flex-row gap-6 items-center w-full">
                <img id="detailPoster" src="" class="w-36 md:w-60 rounded-2xl shadow-2xl border-2 border-white/10">
                <div class="max-w-4xl">
                    <h1 id="detailTitle" class="text-2xl md:text-5xl font-black mb-4">...</h1>
                    <p id="detailStory" class="text-gray-200 text-xs md:text-lg mb-8 leading-relaxed">...</p>
                    <div class="flex gap-4">
                        <button id="detailPlayBtn" class="bg-red-600 text-white px-8 py-2 rounded-xl font-black shadow-lg">▶ مشاهدة</button>
                        <button id="detailTrailerBtn" class="bg-white/10 text-white px-8 py-2 rounded-xl font-black">🎞️ التريلر</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- قسم الحلقات يظهر فقط في المسلسلات -->
        <div id="episodesSection" class="px-6 md:px-20 mt-12 hidden">
            <h3 class="text-xl font-black mb-8 flex items-center gap-2"><span class="w-1 h-6 bg-red-600 block"></span> الحلقات والمواسم</h3>
            <div id="seasonsBar" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar"></div>
            <div id="episodesGrid" class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-6 mt-8"></div>
        </div>
    </div>

    <!-- صفحة المشغل -->
    <div id="playerPage" class="fade-in">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/50 backdrop-blur-md sticky top-0 z-[250] border-b border-white/5">
            <button onclick="closePlayer()" class="bg-red-600 px-4 py-1 rounded-lg font-black text-xs">← العودة</button>
            <h2 id="playerTitle" class="text-xs md:text-xl font-bold truncate text-white italic px-4">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <div id="serverList" class="flex gap-2 mb-4 overflow-x-auto no-scrollbar"></div>
            <div class="video-container mb-10"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
            <h3 class="text-xl font-black mb-8 flex items-center gap-2"><span class="w-1.5 h-8 bg-red-600 block"></span> قد يعجبك أيضاً</h3>
            <div id="recommendationsGrid" class="grid grid-cols-2 md:grid-cols-6 gap-4"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie'; 
        let currentPage = 1;
        let currentLanguage = '';

        window.onscroll = () => {
            const btn = document.getElementById('scrollTopBtn');
            btn.style.opacity = window.scrollY > 500 ? "1" : "0";
        };

        // إصلاح جلب قريباً مع تأمين الصور
        async function fetchComingSoon() {
            const res = await fetch(`${BASE_URL}/movie/upcoming?api_key=${API_KEY}&language=ar-SA&page=1`);
            const data = await res.json();
            const grid = document.getElementById('comingSoonGrid');
            grid.innerHTML = '';
            data.results.forEach(item => {
                const img = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
                grid.innerHTML += `<div class="movie-card w-32 md:w-44" onclick="showDetails(${item.id})"><div class="relative rounded-2xl overflow-hidden aspect-[2/3]"><img src="${img}" class="w-full h-full object-cover"></div></div>`;
            });
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&sort_by=popularity.desc&page=${currentPage}`;
            if (currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid');
            if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                const img = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
                grid.innerHTML += `<div class="movie-card" onclick="showDetails(${item.id})"><div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-lg border-2 border-transparent hover:border-red-600 transition-all"><img src="${img}" class="w-full h-full object-cover"></div><h3 class="mt-2 text-[10px] font-bold truncate text-center">${item.title || item.name}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroDesc').innerText = item.overview || "مشاهدة ممتعة على SbaTa Tv!";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id);
        }

        async function showDetails(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=videos,similar`);
            const data = await res.json();
            
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailBg').src = data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path;
            document.getElementById('detailPoster').src = data.poster_path ? IMG_URL + data.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
            document.getElementById('detailTitle').innerText = data.title || data.name;
            document.getElementById('detailStory').innerText = data.overview || "وصف العمل غير متوفر حالياً.";

            // إظهار/إخفاء الحلقات
            const epSection = document.getElementById('episodesSection');
            if(currentType === 'tv') {
                epSection.classList.remove('hidden');
                loadSeasons(data);
            } else {
                epSection.classList.add('hidden');
            }

            // زر التريلر
            const trailer = data.videos.results.find(v => v.type === 'Trailer');
            const tBtn = document.getElementById('detailTrailerBtn');
            if(trailer) {
                tBtn.onclick = () => { openPlayer(`https://www.youtube.com/embed/${trailer.key}`, "عرض التريلر الرسمي", id); };
                tBtn.style.opacity = "1";
            } else { tBtn.style.opacity = "0.3"; }

            // زر المشاهدة
            document.getElementById('detailPlayBtn').onclick = () => {
                if(currentType === 'movie') setupServers(id, null, null, data.title);
                else epSection.scrollIntoView({behavior:'smooth'});
            };
        }

        function loadSeasons(data) {
            const bar = document.getElementById('seasonsBar');
            bar.innerHTML = '';
            data.seasons.forEach(s => {
                if(s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "server-btn";
                btn.innerText = s.name;
                btn.onclick = () => loadEpisodes(data.id, s.season_number, data.name);
                bar.appendChild(btn);
            });
            loadEpisodes(data.id, 1, data.name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? IMG_URL + ep.still_path : 'https://via.placeholder.com/500x281?text=SbaTa+Tv';
                grid.innerHTML += `<div class="movie-card" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - حلقة ${ep.episode_number}')"><div class="aspect-video rounded-xl overflow-hidden"><img src="${img}" class="w-full h-full object-cover"></div><h4 class="mt-2 text-xs font-bold text-center">الحلقة ${ep.episode_number}</h4></div>`;
            });
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            const svs = [
                {n:'S1', u: currentType==='movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`},
                {n:'S2', u: currentType==='movie' ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/${s}/${e}`}
            ];
            svs.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `server-btn ${i===0?'active':''}`;
                b.innerText = v.n;
                b.onclick = (e) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title, id);
        }

        function openPlayer(url, title, id) {
            const p = document.getElementById('playerPage');
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerTitle').innerText = title;
            p.style.display = 'block';
            fetchRecommendations(id);
        }

        async function fetchRecommendations(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}/similar?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '';
            data.results.slice(0, 6).forEach(item => {
                const img = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
                grid.innerHTML += `<div class="movie-card" onclick="closePlayer(); setTimeout(()=>showDetails(${item.id}),100)"><img src="${img}" class="rounded-xl aspect-[2/3] object-cover"></div>`;
            });
        }

        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchComingSoon();
        fetchContent();
    </script>
</body>
</html>
