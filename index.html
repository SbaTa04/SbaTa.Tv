<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي للأفلام</title>
    <!-- استدعاء أداة التصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="flex justify-between items-center p-6 bg-gray-900 shadow-xl">
        <h1 class="text-2xl font-bold text-red-600">أفلامي - MOVIES</h1>
        <ul class="flex gap-6">
            <li class="hover:text-red-500 cursor-pointer">الرئيسية</li>
            <li class="hover:text-red-500 cursor-pointer">مسلسلات</li>
            <li class="hover:text-red-500 cursor-pointer">أفلام</li>
        </ul>
    </nav>

    <!-- عنوان القسم -->
    <div class="p-8">
        <h2 class="text-3xl font-bold mb-8">الأكثر مشاهدة الآن 🔥</h2>
        
        <!-- شبكة الأفلام -->
        <div id="movie-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- سيتم وضع الأفلام هنا تلقائياً -->
        </div>
    </div>

    <script>
        // هذه هي "البيانات الجاهزة" التي سيعتمد عليها الموقع مؤقتاً
        const movies = [
            { title: "Batman", year: "2022", rating: "8.5", img: "https://via.placeholder.com/300x450/111/fff?text=Batman" },
            { title: "Spider Man", year: "2021", rating: "9.0", img: "https://via.placeholder.com/300x450/222/fff?text=Spider+Man" },
            { title: "Joker", year: "2019", rating: "8.9", img: "https://via.placeholder.com/300x450/333/fff?text=Joker" },
            { title: "Interstellar", year: "2014", rating: "8.6", img: "https://via.placeholder.com/300x450/444/fff?text=Interstellar" },
        ];

        const grid = document.getElementById('movie-grid');

        // كود يقوم برسم الأفلام داخل الصفحة بشكل جذاب
        movies.forEach(movie => {
            grid.innerHTML += `
                <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg transform transition hover:scale-105 cursor-pointer">
                    <img src="${movie.img}" class="w-full h-80 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-semibold">${movie.title}</h3>
                        <div class="flex justify-between mt-2 text-sm text-gray-400">
                            <span>السنة: ${movie.year}</span>
                            <span class="text-yellow-400">⭐ ${movie.rating}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
