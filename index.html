<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | الأحدث دائماً</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* Dropdown Styles */
        .dropdown-content {
            display: none; position: absolute; top: 100%; right: 0;
            background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 9, 20, 0.3); border-radius: 15px;
            min-width: 190px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 1000; overflow: hidden; padding: 8px 0;
        }
        .group:hover .dropdown-content { display: block; animation: fadeIn 0.3s ease; }
        .dropdown-item { padding: 12px 20px; display: block; font-size: 14px; font-weight: 700; color: #ccc; transition: 0.3s; text-align: right; border-right: 3px solid transparent; }
        .dropdown-item:hover { background: rgba(229, 9, 20, 0.15); color: white; border-right-color: var(--main-red); padding-right: 25px; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 24px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid rgba(255, 255, 255, 0.05); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .movie-card { transition: 0.4s; cursor: pointer; }
        .movie-card:hover { transform: translateY(-8px) scale(1.03); }

        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-red); color: white; padding: 2px 8px; border-radius: 6px; margin-right: 5px; font-style: italic; }
        
        #scrollTopBtn { opacity: 0; visibility: hidden; transition: 0.4s; }
        #scrollTopBtn.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
        class="fixed bottom-8 right-8 z-[300] bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
    </button>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[100] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3 md:gap-0">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter" onclick="location.reload()">
                <span class="text-white italic">SbaTa</span><span class="logo-tv">Tv</span>
            </div>
            
            <div class="flex gap-6 items-center">
                <!-- Dropdown Movies -->
                <div class="group relative">
                    <button id="btn-movie" class="text-red-600 transition font-black text-sm md:text-lg flex items-center gap-1">
                        أفلام <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('movie', '')" class="dropdown-item">✨ الأحدث عالمياً</a>
                        <a href="#" onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 أفلام عربية حديثة</a>
                        <a href="#" onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أفلام أجنبية 2024</a>
                        <a href="#" onclick="changeType('movie', 'tr')" class="dropdown-item">🇹🇷 أفلام تركية</a>
                        <a href="#" onclick="changeType('movie', 'hi')" class="dropdown-item">🇮🇳 أفلام هندية</a>
                    </div>
                </div>

                <!-- Dropdown TV -->
                <div class="group relative">
                    <button id="btn-tv" class="text-gray-400 hover:text-red-600 transition font-black text-sm md:text-lg flex items-center gap-1">
                        مسلسلات <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('tv', '')" class="dropdown-item">✨ مسلسلات حديثة</a>
                        <a href="#" onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 دراما عربية 2024</a>
                        <a href="#" onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 مسلسلات تركية</a>
                        <a href="#" onclick="changeType('tv', 'ko')" class="dropdown-item">🇰🇷 دراما كورية</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full md:w-80">
            <input type="text" id="searchInput" placeholder="ابحث في آلاف العناوين..." class="bg-white/10 border border-white/20 rounded-full px-6 py-2 text-sm outline-none focus:border-red-600 w-full font-bold text-white shadow-xl">
        </div>
    </nav>

    <!-- الصفحة الرئيسية -->
    <div id="homePage">
        <header class="relative h-[65vh] md:h-[75vh] flex items-end p-8 md:p-20 pb-20 md:pb-32 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-all duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-4xl md:text-8xl font-black mb-4 leading-tight italic drop-shadow-2xl">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 font-medium italic">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-10 py-3 md:px-16 md:py-5 rounded-2xl font-black text-lg md:text-3xl hover:scale-110 transition-all shadow-[0_0_40px_rgba(229,9,20,0.5)]">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-6 md:px-20 pb-20 -mt-16 md:-mt-24 relative z-20">
            <h2 id="gridTitle" class="text-2xl md:text-4xl font-black mb-10 border-r-8 border-red-600 pr-6 italic uppercase tracking-tighter">أحدث الإضافات</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-6 md:gap-10"></div>
            <div class="flex flex-col items-center mt-20 gap-4">
                <button id="loadMoreBtn" onclick="loadNextPage()" class="bg-white/5 border border-white/10 text-white px-12 py-4 rounded-full font-black text-xl hover:bg-red-600 transition shadow-xl">تحميل المزيد من الإصدارات ↓</button>
            </div>
        </main>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailPage" class="fade-in pb-20 text-right">
        <button onclick="closeDetails()" class="fixed top-24 left-8 z-[210] bg-white/10 p-5 rounded-full text-3xl font-bold backdrop-blur-md hover:bg-red-600 transition">&times;</button>
        <div class="relative h-[60vh] flex items-end p-8 md:p-20">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                <img id="detailPoster" src="" class="w-56 md:w-80 rounded-[30px] shadow-2xl border-4 border-white/5">
                <div class="max-w-4xl">
                    <h1 id="detailTitle" class="text-4xl md:text-8xl font-black mb-6 italic leading-none">...</h1>
                    <p id="detailStory" class="text-gray-200 text-lg md:text-2xl leading-relaxed italic drop-shadow-lg">...</p>
                </div>
            </div>
        </div>
        <div class="px-8 md:px-20 mt-16">
            <h3 class="text-3xl font-black mb-10 flex items-center gap-4"><span class="w-2 h-10 bg-red-600 block"></span> المواسم</h3>
            <div id="seasonsBar" class="flex gap-4 overflow-x-auto pb-6 no-scrollbar"></div>
            <h3 class="text-3xl font-black mt-16 mb-10 flex items-center gap-4"><span class="w-2 h-10 bg-red-600 block"></span> الحلقات</h3>
            <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8"></div>
        </div>
    </div>

    <!-- صفحة المشغل -->
    <div id="playerPage" class="fade-in">
        <nav class="p-6 md:px-12 flex items-center justify-between bg-black/50 backdrop-blur-md sticky top-0 z-[250] border-b border-white/5">
            <button onclick="closePlayer()" class="bg-red-600 px-8 py-2 rounded-xl font-black text-sm hover:bg-white hover:text-black transition">← العودة</button>
            <h2 id="playerTitle" class="text-lg md:text-2xl font-bold truncate text-white italic px-4">...</h2>
            <div class="text-red-600 font-black italic hidden md:block">SbaTa Tv PREMIUM</div>
        </nav>
        <main class="max-w-[1500px] mx-auto p-6 md:p-12 text-right">
            <div class="flex gap-3 mb-6 overflow-x-auto pb-2 no-scrollbar" id="serverList"></div>
            <div class="video-container mb-10"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div class="bg-white/5 p-10 rounded-[40px] border border-white/10 mb-16">
                <div class="flex justify-between items-center mb-8">
                    <h1 id="playerSubTitle" class="text-3xl md:text-6xl font-black italic">...</h1>
                    <div class="bg-yellow-500/10 text-yellow-500 px-6 py-2 rounded-2xl font-black text-2xl">⭐ <span id="playerRate">0.0</span></div>
                </div>
                <p id="playerDesc" class="text-gray-300 text-xl leading-relaxed italic opacity-80">...</p>
            </div>
            <h3 class="text-3xl font-black mb-10 flex items-center gap-4"><span class="w-2 h-10 bg-red-600 block"></span> قد يعجبك أيضاً</h3>
            <div id="recommendationsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-8"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const IMG_W500 = 'https://image.tmdb.org/t/p/w500';
        
        let currentType = 'movie'; 
        let currentPage = 1;
        let currentLanguage = '';
        let globalBackdrop = '';

        window.onscroll = () => {
            const btn = document.getElementById('scrollTopBtn');
            if (window.scrollY > 500) btn.classList.add('show'); else btn.classList.remove('show');
        };

        // --- التحديث الجديد: جلب البيانات مرتبة حسب التاريخ ---
        async function fetchContent(isAppend = false) {
            const today = new Date().toISOString().split('T')[0]; // تاريخ اليوم لمنع الأفلام المستقبلية
            
            // تحديد معامل الترتيب حسب النوع (فيلم أو مسلسل)
            let sortParam = currentType === 'movie' ? 'primary_release_date.desc' : 'first_air_date.desc';
            let dateFilter = currentType === 'movie' ? `primary_release_date.lte=${today}` : `first_air_date.lte=${today}`;

            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&sort_by=${sortParam}&${dateFilter}&page=${currentPage}`;
            if (currentLanguage) url += `&with_original_language=${currentLanguage}`;

            const res = await fetch(url);
            const data = await res.json();
            
            // فلترة النتائج لضمان وجود بوستر وتاريخ (لزيادة الجودة)
            const filteredResults = data.results.filter(item => item.poster_path && (item.release_date || item.first_air_date));
            
            displayGrid(filteredResults, isAppend);
            if (!isAppend && filteredResults[0]) updateHero(filteredResults[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid');
            if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                const year = (item.release_date || item.first_air_date || "").split('-')[0];
                const card = document.createElement('div');
                card.className = 'movie-card group fade-in';
                card.onclick = () => openItem(item);
                card.innerHTML = `
                    <div class="relative rounded-[20px] overflow-hidden aspect-[2/3] shadow-2xl border-2 border-transparent group-hover:border-red-600 transition-all duration-500">
                        <img src="${IMG_W500 + item.poster_path}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-red-600 text-5xl">▶</div>
                        <div class="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded-md shadow-lg">${year}</div>
                    </div>
                    <h3 class="mt-4 text-xs md:text-sm font-bold truncate text-center italic text-white/80">${item.title || item.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        // --- باقي الدوال (التغيير، المشغل، التفاصيل) ---
        function changeType(type, langCode) {
            currentType = type; currentLanguage = langCode; currentPage = 1;
            document.getElementById('btn-movie').className = type === 'movie' ? 'text-red-600 transition font-black text-sm md:text-lg' : 'text-gray-400 hover:text-red-600 transition font-black text-sm md:text-lg';
            document.getElementById('btn-tv').className = type === 'tv' ? 'text-red-600 transition font-black text-sm md:text-lg' : 'text-gray-400 hover:text-red-600 transition font-black text-sm md:text-lg';
            
            let title = "أحدث الإصدارات";
            if(langCode === 'ar') title = "أحدث الأعمال العربية";
            if(langCode === 'tr') title = "أحدث المسلسلات التركية";
            document.getElementById('gridTitle').innerText = title;
            fetchContent();
        }

        function loadNextPage() { currentPage++; fetchContent(true); }

        function updateHero(item) {
            document.getElementById('heroImg').src = IMG_URL + (item.backdrop_path || item.poster_path);
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroDesc').innerText = item.overview || "اكتشف أحدث العروض الحصرية على SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => openItem(item);
        }

        function openItem(item) {
            if(currentType === 'movie') setupServers(item.id, null, null, item.title, item.overview, item.vote_average);
            else showTVDetails(item.id);
        }

        function setupServers(id, s, e, title, desc, rate) {
            const serverList = document.getElementById('serverList');
            serverList.innerHTML = '';
            const servers = [
                { name: 'Server 1', url: currentType === 'movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}` },
                { name: 'Server 2', url: currentType === 'movie' ? `https://vidsrc.me/embed/movie?tmdb=${id}` : `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` },
                { name: 'Server 3', url: currentType === 'movie' ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/${s}/${e}` }
            ];
            servers.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = server.name;
                btn.onclick = (ev) => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    ev.target.classList.add('active');
                    document.getElementById('videoPlayer').src = server.url;
                };
                serverList.appendChild(btn);
            });
            openPlayer(servers[0].url, title, desc, rate, id);
        }

        function openPlayer(url, title, desc, rate, id) {
            const page = document.getElementById('playerPage');
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerSubTitle').innerText = title;
            document.getElementById('playerDesc').innerText = desc || "مشاهدة ممتعة!";
            document.getElementById('playerRate').innerText = rate ? rate.toFixed(1) : "7.5";
            page.style.display = 'block'; page.scrollTo(0,0); document.body.style.overflow = 'hidden';
            fetchRecommendations(id);
        }

        async function fetchRecommendations(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}/similar?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '';
            data.results.slice(0, 12).forEach(item => {
                grid.innerHTML += `<div class="movie-card group" onclick="closePlayer(); setTimeout(() => openItem(${JSON.stringify(item).replace(/"/g, '&quot;')}), 100)"><div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-lg border border-white/5"><img src="${IMG_W500 + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
            });
        }

        async function showTVDetails(tvId) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            globalBackdrop = data.backdrop_path;
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailBg').src = IMG_URL + data.backdrop_path;
            document.getElementById('detailPoster').src = IMG_W500 + data.poster_path;
            document.getElementById('detailTitle').innerText = data.name;
            document.getElementById('detailStory').innerText = data.overview;
            const bar = document.getElementById('seasonsBar');
            bar.innerHTML = '';
            data.seasons.forEach(s => {
                if(s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = `server-btn season-nav-${s.season_number}`;
                btn.innerText = s.name;
                btn.onclick = (e) => {
                    document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    loadEpisodes(tvId, s.season_number, data.name, data.vote_average);
                };
                bar.appendChild(btn);
            });
            document.querySelector('.season-nav-1')?.click();
        }

        async function loadEpisodes(tvId, sNum, tvName, rate) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const epImg = ep.still_path ? (IMG_W500 + ep.still_path) : (IMG_W500 + globalBackdrop);
                grid.innerHTML += `<div class="movie-card" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - حلقة ${ep.episode_number}', '${ep.overview}', ${rate})"><div class="relative aspect-video rounded-xl overflow-hidden border border-white/5"><img src="${epImg}" class="w-full h-full object-cover"><div class="absolute bottom-2 right-2 bg-red-600 px-2 py-0.5 rounded text-[10px] font-black italic">حلقة ${ep.episode_number}</div></div><h4 class="mt-2 text-[10px] md:text-sm font-bold truncate text-center">${ep.name}</h4></div>`;
            });
        }

        function closePlayer() { document.getElementById('playerPage').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display = 'none'; document.body.style.overflow = 'auto'; }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && e.target.value !== '') {
                fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${e.target.value}&language=ar-SA`)
                .then(res => res.json()).then(data => { displayGrid(data.results, false); document.getElementById('gridTitle').innerText = `نتائج البحث: ${e.target.value}`; window.scrollTo(0, 800); });
            }
        });

        // البداية
        fetchContent();
    </script>
</body>
</html>
