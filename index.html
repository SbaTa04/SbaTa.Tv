<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | تجربة سينمائية متكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        .video-container { 
            position: relative; width: 100%; background: #000; border-radius: 20px;
            overflow: hidden; box-shadow: 0 0 50px rgba(229, 9, 20, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.05); aspect-ratio: 16 / 9;
        }

        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 10; }

        .server-btn { background: #1a1e2e; padding: 10px 20px; border-radius: 12px; font-weight: 800; transition: 0.3s; border: 2px solid transparent; color: #9ca3af; font-size: 0.85rem; }
        .server-btn.active { background: var(--main-red); border-color: white; color: white; transform: scale(1.05); }

        .movie-card { transition: 0.4s; cursor: pointer; flex-shrink: 0; }
        .movie-card:hover { transform: translateY(-10px) scale(1.05); }

        .glass-nav { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-red); color: white; padding: 1px 8px; border-radius: 6px; margin-right: 5px; font-style: italic; }
        
        /* Cast Member Styles */
        .cast-item { width: 90px; text-align: center; flex-shrink: 0; }
        .cast-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #222; }

        .ad-banner { background: rgba(255,255,255,0.03); border: 1px dashed #444; height: 90px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 12px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 z-[300] bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center opacity-0 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[100] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter" onclick="location.reload()"><span class="text-white">SbaTa</span><span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <button onclick="changeType('movie', '')" id="btn-movie-top" class="text-red-600 text-sm md:text-lg">أفلام</button>
                <button onclick="changeType('tv', '')" id="btn-tv-top" class="text-gray-400 text-sm md:text-lg">مسلسلات</button>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث في SbaTa Tv..." class="bg-white/10 border border-white/20 rounded-full px-5 py-2 text-sm outline-none focus:border-red-600 w-full md:w-80 font-bold text-white shadow-xl">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[70vh] flex items-end p-8 md:p-20 pb-20 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40 transition-opacity">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-4xl md:text-8xl font-black mb-4 leading-tight italic drop-shadow-2xl">...</h1>
                <p id="heroDesc" class="text-gray-300 text-xs md:text-xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-10 py-3 md:px-16 md:py-4 rounded-2xl font-black text-lg md:text-2xl hover:scale-110 shadow-2xl transition-all">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-6 md:px-20 pb-20 -mt-10 relative z-20">
            <section id="comingSoonSection" class="mb-14">
                <h2 class="text-lg font-black mb-6 flex items-center gap-2 text-yellow-500 underline decoration-red-600">قريباً على SbaTa 🔥</h2>
                <div id="comingSoonGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
            </section>
            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-red-600 pr-4 italic uppercase">رائج الآن</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4 md:gap-8"></div>
            <div class="flex justify-center mt-12"><button onclick="loadNextPage()" class="bg-white/5 border border-white/10 text-white px-10 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-20 left-4 z-[210] bg-white/10 p-3 rounded-full text-xl font-bold backdrop-blur-md hover:bg-red-600 transition">&times;</button>
        <div class="relative min-h-[50vh] flex items-end p-6 md:p-20">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
            <div class="relative z-10 flex flex-col md:flex-row gap-8 items-center w-full">
                <img id="detailPoster" src="" class="w-40 md:w-64 rounded-3xl shadow-2xl border-4 border-white/5">
                <div class="text-center md:text-right">
                    <h1 id="detailTitle" class="text-3xl md:text-6xl font-black mb-4 italic leading-none">...</h1>
                    <p id="detailStory" class="text-gray-200 text-sm md:text-xl leading-relaxed italic font-bold mb-8">...</p>
                    <div class="flex gap-4 justify-center md:justify-start">
                        <button id="detailPlayBtn" class="bg-red-600 text-white px-8 py-3 rounded-xl font-black shadow-lg hover:scale-105 transition">▶ مشاهدة</button>
                        <button id="detailTrailerBtn" class="bg-white/10 border border-white/10 text-white px-8 py-3 rounded-xl font-black hover:bg-white hover:text-black transition">🎞️ التريلر</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-6 md:px-20 mt-10">
            <h3 class="text-xl font-black mb-6 flex items-center gap-3"><span class="w-1.5 h-6 bg-blue-500 block"></span> طاقم العمل</h3>
            <div id="castGrid" class="flex gap-6 overflow-x-auto no-scrollbar pb-6"></div>
            <div id="episodesSection" class="hidden">
                <h3 class="text-xl font-black mb-6 flex items-center gap-3"><span class="w-1.5 h-6 bg-red-600 block"></span> الحلقات والمواسم</h3>
                <div id="seasonsBar" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar"></div>
                <div id="episodesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-8"></div>
            </div>
        </div>
    </div>

    <!-- صفحة المشغل (تم ملء الفراغات هنا) -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/50 backdrop-blur-md sticky top-0 z-[250] border-b border-white/5">
            <button onclick="closePlayer()" class="bg-red-600 px-5 py-2 rounded-xl font-black text-sm hover:bg-white hover:text-black transition">← العودة</button>
            <h2 id="playerTitle" class="text-sm md:text-xl font-bold truncate text-white italic px-4">...</h2>
            <div class="text-red-600 font-black italic hidden md:block">SbaTa Tv PREMIUM</div>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <!-- المشغل -->
            <div class="w-full mb-8">
                <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-bold"></div>
                <div class="video-container">
                    <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
                </div>
            </div>

            <!-- معلومات العمل أسفل المشغل مباشرة لملء الفراغ -->
            <div class="bg-white/5 p-6 md:p-10 rounded-[30px] border border-white/10 shadow-2xl mb-12 fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h1 id="playerInfoTitle" class="text-2xl md:text-5xl font-black italic">...</h1>
                    <div id="playerRate" class="bg-yellow-500 text-black px-3 py-1 rounded-lg font-black text-sm md:text-xl shadow-[0_0_15px_#fbbf24]">⭐ 0.0</div>
                </div>
                <p id="playerInfoDesc" class="text-gray-300 text-sm md:text-xl italic leading-relaxed font-bold border-r-4 border-red-600 pr-6">...</p>
            </div>

            <!-- المقترحات المشابهة -->
            <h3 class="text-xl md:text-3xl font-black mb-8 flex items-center gap-3"><span class="w-2 h-8 bg-red-600 block"></span> محتوى مشابه قد يعجبك</h3>
            <div id="playerRecommendationsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4">
                <!-- تم ملء الفراغ بالأفلام المقترحة -->
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie'; 
        let currentPage = 1;
        let currentLanguage = '';

        window.onscroll = () => {
            const btn = document.getElementById('scrollTopBtn');
            btn.style.opacity = window.scrollY > 500 ? "1" : "0";
        };

        async function fetchComingSoon() {
            const res = await fetch(`${BASE_URL}/movie/upcoming?api_key=${API_KEY}&language=ar-SA&page=1`);
            const data = await res.json();
            const grid = document.getElementById('comingSoonGrid');
            grid.innerHTML = '';
            data.results.forEach(item => {
                if(!item.poster_path) return;
                grid.innerHTML += `<div class="movie-card w-32 md:w-44" onclick="showDetails(${item.id})"><div class="relative rounded-2xl overflow-hidden aspect-[2/3]"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
            });
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&sort_by=popularity.desc&page=${currentPage}`;
            if (currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid');
            if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                grid.innerHTML += `<div class="movie-card group" onclick="showDetails(${item.id})"><div class="relative rounded-2xl overflow-hidden aspect-[2/3] shadow-lg border-2 border-transparent hover:border-red-600 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div><h3 class="mt-3 text-[10px] font-bold truncate text-center">${item.title || item.name}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroDesc').innerText = item.overview || "مشاهدة ممتعة على SbaTa Tv!";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id);
        }

        async function showDetails(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=videos,credits,similar`);
            const data = await res.json();
            
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailPage').scrollTo(0,0);
            
            document.getElementById('detailBg').src = data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path;
            document.getElementById('detailPoster').src = data.poster_path ? IMG_URL + data.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
            document.getElementById('detailTitle').innerText = data.title || data.name;
            document.getElementById('detailStory').innerText = data.overview || "وصف العمل غير متوفر حالياً.";

            // طاقم العمل
            const castGrid = document.getElementById('castGrid');
            castGrid.innerHTML = '';
            data.credits.cast.slice(0, 12).forEach(c => {
                if(!person_img) var person_img = c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/100x100?text=No+Img';
                castGrid.innerHTML += `<div class="cast-item"><img src="${person_img}" class="cast-img"><p class="text-[9px] font-bold truncate">${c.name}</p></div>`;
            });

            // الحلقات
            const epSection = document.getElementById('episodesSection');
            if(currentType === 'tv') { epSection.classList.remove('hidden'); loadSeasons(data); } 
            else { epSection.classList.add('hidden'); }

            // زر التريلر
            const trailer = data.videos.results.find(v => v.type === 'Trailer');
            const tBtn = document.getElementById('detailTrailerBtn');
            if(trailer) {
                tBtn.onclick = () => { openPlayer(`https://www.youtube.com/embed/${trailer.key}`, "عرض التريلر الرسمي", id, data); };
                tBtn.style.display = "block";
            } else { tBtn.style.display = "none"; }

            // زر المشاهدة
            document.getElementById('detailPlayBtn').onclick = () => {
                if(currentType === 'movie') setupServers(id, null, null, data.title, data);
                else epSection.scrollIntoView({behavior:'smooth'});
            };
        }

        function loadSeasons(data) {
            const bar = document.getElementById('seasonsBar');
            bar.innerHTML = '';
            data.seasons.forEach(s => {
                if(s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "server-btn"; btn.innerText = s.name;
                btn.onclick = () => loadEpisodes(data.id, s.season_number, data.name, data);
                bar.appendChild(btn);
            });
            loadEpisodes(data.id, 1, data.name, data);
        }

        async function loadEpisodes(tvId, sNum, tvName, tvData) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? IMG_URL + ep.still_path : IMG_URL + (tvData.poster_path || "");
                grid.innerHTML += `<div class="movie-card" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - حلقة ${ep.episode_number}', ${JSON.stringify(ep).replace(/'/g, "")})"><div class="aspect-video rounded-xl overflow-hidden shadow-lg border border-white/5"><img src="${img}" class="w-full h-full object-cover"></div><h4 class="mt-2 text-[10px] font-bold text-center italic text-white">الحلقة ${ep.episode_number}</h4></div>`;
            });
        }

        function setupServers(id, s, e, title, fullData) {
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            const svs = [{n:'S1', u: currentType==='movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`}, {n:'S2', u: currentType==='movie' ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/${s}/${e}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `server-btn ${i===0?'active':''}`; b.innerText = v.n;
                b.onclick = (e) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title, id, fullData);
        }

        async function openPlayer(url, title, id, fullData) {
            const p = document.getElementById('playerPage');
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerTitle').innerText = title;
            
            // ملء معلومات العمل أسفل المشغل لملء الفراغ
            document.getElementById('playerInfoTitle').innerText = fullData.title || fullData.name || title;
            document.getElementById('playerInfoDesc').innerText = fullData.overview || "مشاهدة ممتعة على SbaTa Tv!";
            document.getElementById('playerRate').innerText = `⭐ ${(fullData.vote_average || 8.5).toFixed(1)}`;
            
            p.style.display = 'block';
            p.scrollTo(0,0);
            document.body.style.overflow = 'hidden';

            // جلب مقترحات مشابهة لملء الفراغ الأخير
            const simRes = await fetch(`${BASE_URL}/${currentType}/${id}/similar?api_key=${API_KEY}&language=ar-SA`);
            const simData = await simRes.json();
            const grid = document.getElementById('playerRecommendationsGrid');
            grid.innerHTML = '';
            simData.results.slice(0, 16).forEach(item => {
                if(!item.poster_path) return;
                grid.innerHTML += `<div class="movie-card" onclick="closePlayer(); setTimeout(()=>showDetails(${item.id}),100)"><img src="${IMG_URL + item.poster_path}" class="rounded-xl w-full aspect-[2/3] object-cover shadow-2xl"></div>`;
            });
        }

        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchComingSoon();
        fetchContent();
    </script>
</body>
</html>
