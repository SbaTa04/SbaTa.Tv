<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | الواجهة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* الأقسام المنبثقة */
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; }

        /* تصميم القوائم المنسدلة */
        .glass-nav { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }

        /* تنسيق السلايدر (أزرار التنقل) */
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .slider-row { display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 0; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: rgba(0,0,0,0.7); color: var(--main-yellow); border-radius: 50%; z-index: 10; display: flex; items-center; justify-content: center; cursor: pointer; border: 1px solid var(--main-yellow); font-size: 1.2rem; opacity: 0; transition: 0.3s; }
        .slider-container:hover .slider-btn { opacity: 1; }
        .btn-left { left: 5px; } .btn-right { right: 5px; }

        /* تنسيق القنوات (دوائر كما في الرسم) */
        .channel-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--main-yellow); overflow: hidden; flex-shrink: 0; cursor: pointer; transition: 0.3s; }
        .channel-circle:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--main-yellow); }

        /* بطاقة الفيلم */
        .movie-card { width: 140px; flex-shrink: 0; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-img { width: 100%; aspect-ratio: 2/3; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        
        .section-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 15px; display: flex; items-center; gap: 10px; color: var(--main-yellow); text-transform: uppercase; }
        .section-title span { width: 4px; height: 20px; background: var(--main-yellow); display: block; }

        .btn-gold { background: var(--main-yellow); color: black; font-weight: 900; padding: 8px 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- القائمة العلوية (Navbar) -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-2">
        <div class="flex items-center justify-between w-full md:w-auto gap-6">
            <div class="text-xl md:text-2xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-4 text-xs md:text-sm font-bold">
                <button onclick="location.reload()" class="text-yellow-400">الرئيسية</button>
                <button onclick="changeType('movie')" class="hover:text-yellow-400 transition">الأفلام</button>
                <button onclick="changeType('tv')" class="hover:text-yellow-400 transition">المسلسلات</button>
                <button onclick="changeGenre('16')" class="hover:text-yellow-400 transition">أنمي</button>
                <button onclick="window.scrollTo(0, 500)" class="hover:text-yellow-400 transition">القنوات</button>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="بحث مباشر عن فيلم أو مسلسل..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <!-- 1. السلايدر الرئيسي (Hero) -->
        <header id="mainHero" class="relative h-[50vh] md:h-[70vh] flex items-end p-8 md:p-20 pb-12 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-3xl md:text-6xl font-black mb-2 uppercase italic drop-shadow-2xl">...</h1>
                <button id="heroPlayBtn" class="btn-gold mt-4 shadow-2xl">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 mt-8">
            
            <!-- 2. قنوات البث المباشر (دوائر) -->
            <section class="mb-12">
                <h2 class="section-title"><span></span> قنوات البث المباشر</h2>
                <div class="flex gap-6 overflow-x-auto no-scrollbar pb-4" id="channelsGrid">
                    <!-- القنوات تظهر هنا -->
                </div>
            </section>

            <!-- الأقسام المتتالية كما في الرسم -->
            <div id="dynamicSections">
                <!-- آخر الأفلام المضافة -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> آخر الأفلام المضافة</h2>
                    <div class="slider-row no-scrollbar" id="lastAddedMovies"></div>
                    <div onclick="sideScroll('lastAddedMovies', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('lastAddedMovies', 300)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- تريند -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> تريند TRENDING</h2>
                    <div class="slider-row no-scrollbar" id="trendingRow"></div>
                    <div onclick="sideScroll('trendingRow', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('trendingRow', 300)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- أفضل الأفلام العربية -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> أفضل الأفلام العربية</h2>
                    <div class="slider-row no-scrollbar" id="arabicMovies"></div>
                    <div onclick="sideScroll('arabicMovies', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('arabicMovies', 300)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- أفضل الأفلام الأجنبية -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> أفضل الأفلام الأجنبية</h2>
                    <div class="slider-row no-scrollbar" id="foreignMovies"></div>
                    <div onclick="sideScroll('foreignMovies', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('foreignMovies', 300)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- أفضل المسلسلات الأجنبية -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> أفضل المسلسلات الأجنبية</h2>
                    <div class="slider-row no-scrollbar" id="foreignSeries"></div>
                    <div onclick="sideScroll('foreignSeries', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('foreignSeries', 300)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- أفضل المسلسلات العربية -->
                <section class="mb-12 slider-container">
                    <h2 class="section-title"><span></span> أفضل المسلسلات العربية</h2>
                    <div class="slider-row no-scrollbar" id="arabicSeries"></div>
                    <div onclick="sideScroll('arabicSeries', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="sideScroll('arabicSeries', 300)" class="slider-btn btn-right">❯</div>
                </section>
            </div>
        </main>
    </div>

    <!-- صفحة التفاصيل وصفحة المشغل -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-20 right-6 z-[10000] btn-gold px-6">رجوع</button>
        <div id="detailDynamicContent"></div>
    </div>

    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="btn-gold px-6 py-1 text-sm">رجوع</button>
            <h2 id="playerTitle" class="text-sm font-bold text-white uppercase">...</h2>
        </nav>
        <main class="p-4"><div class="video-container"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div></main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';

        // دالة تحريك السلايدر
        function sideScroll(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        // بيانات القنوات (دوائر)
        const channels = [
            { name: 'BeIN News', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/BeIN_Sports_logo.svg/1200px-BeIN_Sports_logo.svg.png', url: 'https://vaughn.live/embed/video/beinsportsnews' },
            { name: 'MBC 1', img: 'https://upload.wikimedia.org/wikipedia/ar/thumb/7/70/MBC1_Logo.svg/1200px-MBC1_Logo.svg.png', url: 'https://www.elahmad.com/tv/embed/mbc1.php' },
            { name: 'Al Jazeera', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Al_Jazeera_logo.svg/1200px-Al_Jazeera_logo.svg.png', url: 'https://www.youtube.com/embed/gCNeDWCI0vo' }
        ];

        function loadChannels() {
            const grid = document.getElementById('channelsGrid');
            grid.innerHTML = channels.map(c => `
                <div class="text-center shrink-0" onclick="openPlayer('${c.url}', '${c.name}')">
                    <div class="channel-circle"><img src="${c.img}" class="w-full h-full object-contain p-2"></div>
                    <p class="text-[10px] mt-2 font-bold">${c.name}</p>
                </div>
            `).join('');
        }

        async function fetchRow(url, containerId, type) {
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById(containerId);
            container.innerHTML = data.results.map(item => `
                <div class="movie-card" onclick="showDetails(${item.id}, '${type}')">
                    <img src="${IMG_URL + item.poster_path}" class="movie-img shadow-xl">
                    <p class="text-[9px] mt-2 font-bold truncate text-center uppercase">${item.original_title || item.original_name}</p>
                </div>
            `).join('');
            return data.results[0];
        }

        async function init() {
            loadChannels();
            // جلب الأقسام بالترتيب
            const heroItem = await fetchRow(`${BASE_URL}/movie/now_playing?api_key=${API_KEY}&language=en-US`, 'lastAddedMovies', 'movie');
            fetchRow(`${BASE_URL}/trending/all/week?api_key=${API_KEY}`, 'trendingRow', 'movie');
            fetchRow(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=ar`, 'arabicMovies', 'movie');
            fetchRow(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=en`, 'foreignMovies', 'movie');
            fetchRow(`${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=en`, 'foreignSeries', 'tv');
            fetchRow(`${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=ar`, 'arabicSeries', 'tv');
            
            // تحديث الهيرو
            if(heroItem) {
                document.getElementById('heroImg').src = IMG_ORG + heroItem.backdrop_path;
                document.getElementById('heroTitle').innerText = heroItem.original_title;
                document.getElementById('heroPlayBtn').onclick = () => showDetails(heroItem.id, 'movie');
            }
        }

        async function showDetails(id, type) {
            const resAr = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const dataAr = await resAr.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailPage').scrollTo(0,0);
            
            document.getElementById('detailDynamicContent').innerHTML = `
                <div class="relative min-h-[50vh] flex items-center p-8 md:p-20 overflow-hidden text-right">
                    <img src="${dataAr.backdrop_path ? IMG_ORG + dataAr.backdrop_path : ''}" class="absolute inset-0 w-full h-full object-cover opacity-30">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
                    <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                        <img src="${IMG_URL + dataAr.poster_path}" class="w-56 rounded-3xl shadow-2xl border-4 border-yellow-400/20 shrink-0">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-7xl font-black mb-4 uppercase text-white leading-tight">${dataEn.original_title || dataEn.original_name}</h1>
                            <p class="text-gray-200 text-sm md:text-2xl leading-relaxed italic mb-10 text-white font-bold">${dataAr.overview || "القصة غير متوفرة."}</p>
                            <button onclick="setupServers(${id}, ${type==='tv'?'1':'null'}, ${type==='tv'?'1':'null'}, '${dataEn.original_title || dataEn.original_name}')" class="btn-gold px-12 shadow-xl">▶ شاهد الآن</button>
                        </div>
                    </div>
                </div>
                <div class="px-8 md:px-24 mt-10">
                    ${type === 'tv' ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 mb-16 text-right"><div class="text-right"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic underline">Seasons</h3><div class="flex flex-col gap-3">${dataAr.seasons.filter(s=>s.season_number > 0).map(s => `<button onclick="loadEpisodes(${id}, ${s.season_number}, '${dataEn.original_name}')" class="btn-gold">${s.name}</button>`).join('')}</div></div><div class="md:col-span-2 text-right"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic underline">Episodes</h3><div id="epGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div></div>` : ''}
                    <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase italic underline">Cast</h3>
                    <div class="flex gap-6 overflow-x-auto no-scrollbar mb-16">${dataAr.credits.cast.slice(0,10).map(c => `<div class="cast-item text-center flex-shrink-0 w-24"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto shadow-xl"><p class="text-[10px] mt-2 font-bold text-white uppercase">${c.name}</p></div>`).join('')}</div>
                </div>
            `;
            if(type === 'tv') loadEpisodes(id, 1, dataEn.original_name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            document.getElementById('epGrid').innerHTML = data.episodes.map(ep => `<div class="movie-card w-full" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - Episode ${ep.episode_number}')"><img src="${ep.still_path ? IMG_URL+ep.still_path : 'https://via.placeholder.com/500x281'}" class="rounded-xl aspect-video object-cover shadow-lg"><h4 class="mt-2 text-xs font-bold text-center uppercase text-white">EP ${ep.episode_number}</h4></div>`).join('');
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'S1', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'S2', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `btn-gold ${i===0?'active' : ''} text-sm px-10 py-2 rounded-xl`; b.innerText = v.n;
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; document.body.style.overflow = 'hidden'; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }

        init();
    </script>
</body>
</html>
