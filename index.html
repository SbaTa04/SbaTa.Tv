<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Golden Edition 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { display: none; }

        /* نظام الفوكس الاحترافي */
        *:focus { outline: none !important; }
        *:focus-visible { outline: 3px solid var(--main-yellow) !important; outline-offset: 4px; transform: scale(1.05) !important; z-index: 100; box-shadow: 0 0 30px var(--main-yellow); border-radius: 15px; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* القائمة المنسدلة */
        .dropdown-content {
            display: none; position: absolute; top: 100%; right: 0;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(25px);
            border: 1px solid var(--main-yellow); border-radius: 12px;
            min-width: 200px; box-shadow: 0 20px 50px rgba(0,0,0,1);
            z-index: 5000; overflow: hidden;
        }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 15px 20px; display: block; font-size: 16px; font-weight: 800; color: #fff; transition: 0.3s; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        /* السلايدر */
        .slider-btn {
            position: absolute; top: 0; bottom: 0; width: 50px;
            background: rgba(0,0,0,0.6); color: var(--main-yellow); display: flex;
            align-items: center; justify-content: center; z-index: 50;
            cursor: pointer; opacity: 0; transition: 0.4s; border: none; font-size: 2rem;
        }
        .slider-container:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }
        .btn-left { left: 0; border-radius: 0 20px 20px 0; } 
        .btn-right { right: 0; border-radius: 20px 0 0 20px; }

        .movie-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; width: 140px; outline: none; }
        @media (min-width: 1025px) { .movie-card { width: 220px !important; } }

        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 10px; border-radius: 8px; margin-right: 5px; font-weight: 900; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-10 right-10 z-[300] bg-yellow-400 text-black w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all opacity-0 hover:scale-110"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-4 flex flex-col md:flex-row justify-between items-center glass-nav gap-4">
        <div class="flex items-center justify-between w-full md:w-auto gap-10">
            <div class="text-3xl md:text-5xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-8 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-lg md:text-2xl outline-none">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', '')" class="dropdown-item">✨ التريند والأحدث</div>
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 أفلام عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أفلام أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-lg md:text-2xl outline-none transition">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', '')" class="dropdown-item">✨ مسلسلات 2026</div>
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 مسلسلات عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 مسلسلات أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 مسلسلات تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث عن الأفلام والمسلسلات..." class="bg-white/10 border-2 border-yellow-400/30 rounded-full px-8 py-2 text-xl outline-none focus:border-yellow-400 w-full md:w-[450px] text-white font-bold transition-all">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header class="relative h-[65vh] md:h-[80vh] flex items-end p-8 md:p-24 pb-20 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-5xl">
                <h1 id="heroTitle" class="text-4xl md:text-8xl font-black mb-4 uppercase italic drop-shadow-2xl text-white leading-tight">...</h1>
                <p id="heroDesc" class="text-gray-200 text-sm md:text-2xl mb-10 line-clamp-3 font-bold italic max-w-4xl">...</p>
                <button id="heroPlayBtn" class="bg-yellow-400 text-black px-12 py-4 md:px-16 md:py-5 rounded-2xl font-black text-xl md:text-3xl shadow-2xl hover:scale-110 active:scale-95 transition">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="px-6 md:px-24 pb-32 -mt-10 relative z-20">
            
            <!-- هذا القسم سيختفي عند البحث -->
            <div id="homeSections">
                <!-- TOP PICKS Slider -->
                <section class="mb-16">
                    <h2 class="text-2xl md:text-4xl font-black mb-8 flex items-center gap-4 text-yellow-400 italic uppercase"><span class="w-2 h-10 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                    <div class="slider-container relative group">
                        <button onclick="slide('topPicksGrid', -600)" class="slider-btn btn-left">❮</button>
                        <div id="topPicksGrid" class="flex gap-6 md:gap-10 overflow-x-auto no-scrollbar pb-6 scroll-smooth"></div>
                        <button onclick="slide('topPicksGrid', 600)" class="slider-btn btn-right">❯</button>
                    </div>
                </section>

                <!-- COMING SOON Slider -->
                <section class="mb-16">
                    <h2 class="text-2xl md:text-4xl font-black mb-8 flex items-center gap-4 text-white uppercase italic"><span class="w-2 h-10 bg-white block shadow-[0_0_15px_white]"></span> COMING SOON</h2>
                    <div class="slider-container relative group">
                        <button onclick="slide('comingSoonGrid', -600)" class="slider-btn btn-left">❮</button>
                        <div id="comingSoonGrid" class="flex gap-6 md:gap-10 overflow-x-auto no-scrollbar pb-6 scroll-smooth"></div>
                        <button onclick="slide('comingSoonGrid', 600)" class="slider-btn btn-right">❯</button>
                    </div>
                </section>
            </div>

            <h2 id="gridTitle" class="text-2xl md:text-5xl font-black mb-12 border-r-8 border-yellow-400 pr-6 uppercase tracking-widest italic">TRENDING</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-8"></div>
            <div class="flex justify-center mt-24"><button onclick="loadNextPage()" class="bg-white/5 border-2 border-yellow-400/20 text-white px-16 py-5 rounded-full font-black text-2xl hover:bg-yellow-400 hover:text-black transition">Explore More ↓</button></div>
        </main>
    </div>

    <!-- التفاصيل والمشغل -->
    <div id="detailPage" class="fade-in">
        <button onclick="closeDetails()" class="fixed top-24 left-8 z-[10000] bg-yellow-400 text-black p-4 rounded-full text-3xl font-bold shadow-2xl hover:bg-white transition">&times;</button>
        <div id="detailHeroContainer"></div>
        <div class="px-8 md:px-24 mt-10" id="detailExtra"></div>
    </div>

    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-6 md:p-10 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="bg-yellow-400 text-black px-10 py-3 rounded-2xl font-black text-xl">← BACK</button>
            <h2 id="playerTitle" class="text-lg md:text-4xl font-bold truncate text-white uppercase px-6 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-6 md:p-12">
            <div id="serverList" class="flex gap-4 mb-8 overflow-x-auto no-scrollbar font-black"></div>
            <div class="video-container shadow-[0_0_100px_rgba(250,204,21,0.2)]"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        // --- محرك البحث المصلح ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value;
            const homeSections = document.getElementById('homeSections');
            const gridTitle = document.getElementById('gridTitle');

            if (query.length > 2) {
                homeSections.style.display = 'none'; // إخفاء السلايدرات أثناء البحث
                gridTitle.innerText = `Search Results for: ${query.toUpperCase()}`;
                
                fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${query}&language=en-US`)
                .then(res => res.json())
                .then(data => displayGrid(data.results, false));
            } else if (query.length === 0) {
                homeSections.style.display = 'block'; // إعادة السلايدرات عند مسح البحث
                gridTitle.innerText = 'TRENDING';
                fetchContent();
            }
        });

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396, 115036]; 
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                const item = await res.json();
                if(item.poster_path) {
                    grid.innerHTML += `<div class="movie-card group" tabindex="0" onclick="openItemById(${item.id}, 'tv')"><div class="relative rounded-[25px] overflow-hidden aspect-[2/3] shadow-2xl border-4 border-white/5 group-hover:border-yellow-400 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
                }
            }
        }

        async function fetchComingSoon() {
            const res = await fetch(`${BASE_URL}/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`);
            const data = await res.json();
            const grid = document.getElementById('comingSoonGrid'); grid.innerHTML = '';
            data.results.forEach(item => {
                if(!item.poster_path) return;
                grid.innerHTML += `<div class="movie-card" tabindex="0" onclick="openItemById(${item.id}, 'movie')"><div class="relative rounded-[25px] overflow-hidden aspect-[2/3] shadow-2xl border-4 border-white/5 group-hover:border-yellow-400 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
            });
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.original_title || item.original_name || item.title;
                const year = (item.release_date || item.first_air_date || "2026").split('-')[0];
                grid.innerHTML += `<div class="movie-card group w-full" tabindex="0" onclick="openItemById(${item.id}, '${currentType}')"><div class="relative rounded-[20px] overflow-hidden aspect-[2/3] shadow-2xl border-2 border-transparent group-hover:border-yellow-400 transition-all duration-500"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"><div class="absolute top-4 right-4 bg-yellow-400 text-black text-xs font-black px-3 py-1 rounded-lg z-10">${year}</div></div><h3 class="mt-4 text-sm font-bold truncate text-center uppercase italic text-white/70">${title}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "Stream now on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => openItemById(item.id, currentType);
        }

        async function openItemById(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=similar,credits`);
            const data = await res.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            
            const heroContainer = document.getElementById('detailHeroContainer');
            heroContainer.innerHTML = `
                <div class="relative min-h-[60vh] md:min-h-[80vh] flex items-end p-8 md:p-24 overflow-hidden text-right">
                    <img src="${data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path}" class="absolute inset-0 w-full h-full object-cover opacity-30">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
                    <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                        <img src="${IMG_URL + data.poster_path}" class="w-64 md:w-96 rounded-[40px] shadow-2xl border-4 border-yellow-400/20">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-8xl font-black mb-4 uppercase italic text-white leading-tight">${dataEn.original_title || dataEn.original_name || dataEn.title}</h1>
                            <p class="text-gray-200 text-lg md:text-3xl leading-relaxed max-w-4xl font-bold italic mb-10">${data.overview || "القصة غير متوفرة."}</p>
                            <button onclick="setupServers(${id}, ${type==='tv'?'1':'null'}, ${type==='tv'?'1':'null'}, '${dataEn.original_title}')" class="bg-yellow-400 text-black px-12 py-4 md:px-20 md:py-6 rounded-2xl font-black text-xl md:text-3xl shadow-2xl hover:scale-105 transition">▶ شاهد الآن</button>
                        </div>
                    </div>
                </div>
            `;

            const extraContainer = document.getElementById('detailExtra');
            extraContainer.innerHTML = `
                <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase tracking-widest">Top Cast</h3>
                <div class="flex gap-6 overflow-x-auto no-scrollbar mb-16">${data.credits.cast.slice(0,10).map(c => `<div class="text-center w-24 flex-shrink-0"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto"><p class="text-[10px] mt-2 font-bold">${c.name}</p></div>`).join('')}</div>
                <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase tracking-widest">Recommended</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6 pb-24">${data.similar.results.slice(0,16).map(s => `<div class="movie-card group" onclick="openItemById(${s.id}, '${type}')"><img src="${IMG_URL+s.poster_path}" class="rounded-[25px] w-full h-full object-cover shadow-2xl border-2 border-white/5 hover:border-yellow-400 transition-all"></div>`).join('')}</div>
            `;
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'SERVER 1', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'SERVER 2', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `server-btn ${i===0?'active' : ''} text-black bg-yellow-400 font-black px-12 py-4 rounded-xl`; b.innerText = v.n;
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchTopPicks(); fetchComingSoon(); fetchContent();
    </script>
</body>
</html>
