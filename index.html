<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Cinema 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
        *:focus { outline: none !important; }
        *:focus-visible { outline: 3px solid var(--main-yellow) !important; outline-offset: 4px; transform: scale(1.05) !important; z-index: 100; box-shadow: 0 0 30px var(--main-yellow); border-radius: 15px; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(25px); border: 1px solid var(--main-yellow); border-radius: 12px; min-width: 200px; box-shadow: 0 20px 50px rgba(0,0,0,1); z-index: 5000; overflow: hidden; }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 15px 20px; display: block; font-size: 16px; font-weight: 800; color: #fff; transition: 0.3s; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        .slider-btn { position: absolute; top: 0; bottom: 0; width: 50px; background: rgba(0,0,0,0.6); color: var(--main-yellow); display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer; opacity: 0; transition: 0.4s; border: none; font-size: 2rem; }
        .slider-container:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: rgba(0,0,0,0.8); }
        .btn-left { left: 0; border-radius: 0 20px 20px 0; } 
        .btn-right { right: 0; border-radius: 20px 0 0 15px; }

        .movie-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; width: 140px; outline: none; }
        @media (min-width: 1025px) { .movie-card { width: 190px !important; } }

        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .cast-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--main-yellow); }
        .season-btn { background: #1a1e2e; padding: 10px 20px; border-radius: 10px; font-weight: 800; transition: 0.3s; border: 1px solid transparent; }
        .season-btn.active { background: var(--main-yellow); color: black; border-color: white; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-10 right-10 z-[300] bg-yellow-400 text-black w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all opacity-0 hover:scale-110"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-2">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-sm md:text-xl px-2 py-1">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-sm md:text-xl px-2 py-1 transition">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="ابحث عن العناوين الأصلية..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[80vh] flex items-end p-8 md:p-20 pb-16 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl text-right">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-4 uppercase italic drop-shadow-2xl text-white">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-yellow-400 text-black px-10 py-3 rounded-xl font-black text-lg md:text-2xl hover:scale-110 transition shadow-2xl">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20">
            <!-- TOP PICKS -->
            <section class="mb-14">
                <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-400 uppercase italic"><span class="w-1.5 h-8 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                <div class="relative group slider-container">
                    <div id="topPicksGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth"></div>
                    <div onclick="slide('topPicksGrid', -400)" class="slider-btn btn-left">❮</div>
                    <div onclick="slide('topPicksGrid', 400)" class="slider-btn btn-right">❯</div>
                </div>
            </section>

            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-yellow-400 pr-4 italic uppercase">Trending Now</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
            <div class="flex justify-center mt-20"><button onclick="loadNextPage()" class="bg-white/5 border border-yellow-400/20 text-white px-10 py-3 rounded-full font-bold hover:bg-yellow-400 hover:text-black transition shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل المصلحة بالكامل -->
    <div id="detailPage" class="fade-in">
        <button onclick="closeDetails()" class="fixed top-20 right-4 z-[10000] bg-yellow-400 text-black p-3 rounded-full text-2xl font-bold shadow-2xl transition hover:scale-110">&times;</button>
        <div id="detailHeroContainer"></div>
        <div id="detailExtraContent" class="px-6 md:px-16 mt-10"></div>
    </div>

    <!-- المشغل -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="bg-yellow-400 text-black px-8 py-2 rounded-xl font-black text-sm transition">← BACK</button>
            <h2 id="playerTitle" class="text-lg md:text-2xl font-bold truncate text-white uppercase px-6 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-12 text-right">
            <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-black text-black"></div>
            <div class="video-container shadow-[0_0_100px_rgba(250,204,21,0.2)]"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value;
            if(q.length > 2) {
                fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(r => r.json()).then(d => displayGrid(d.results, false));
            }
        });

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396]; // Dead City & Mehmed included
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                try {
                    const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                    const item = await res.json();
                    grid.innerHTML += `<div class="movie-card group shrink-0" onclick="showDetails(${item.id}, 'tv')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border-2 border-transparent hover:border-yellow-400 transition-all w-full"></div>`;
                } catch(e) {}
            }
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            if(currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.original_title || item.original_name || item.title;
                grid.innerHTML += `<div class="movie-card group" onclick="showDetails(${item.id}, '${currentType}')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border border-white/5"><h3 class="mt-3 text-[11px] font-bold truncate text-center uppercase italic opacity-80">${title}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "Stream now on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id, currentType);
        }

        async function showDetails(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=similar,credits`);
            const data = await res.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailPage').scrollTo(0,0);
            
            // بناء رأس صفحة التفاصيل
            document.getElementById('detailHeroContainer').innerHTML = `
                <div class="relative min-h-[50vh] md:min-h-[70vh] flex items-end p-8 md:p-20 overflow-hidden text-right">
                    <img src="${data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path}" class="absolute inset-0 w-full h-full object-cover opacity-30">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent text-right"></div>
                    <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                        <img src="${IMG_URL + data.poster_path}" class="w-48 md:w-72 rounded-3xl shadow-2xl border-4 border-yellow-400/20">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-7xl font-black mb-4 uppercase italic text-white leading-tight">${dataEn.original_title || dataEn.original_name || dataEn.title}</h1>
                            <p class="text-gray-200 text-sm md:text-2xl leading-relaxed max-w-4xl font-bold italic mb-10 text-white">${data.overview || "القصة غير متوفرة."}</p>
                            <button onclick="setupServers(${id}, ${type==='tv'?'1':'null'}, ${type==='tv'?'1':'null'}, '${dataEn.original_title || dataEn.title}')" class="bg-yellow-400 text-black px-12 py-4 rounded-2xl font-black text-xl shadow-2xl hover:scale-105 transition">▶ شاهد الآن</button>
                        </div>
                    </div>
                </div>
            `;

            // بناء المحتوى الإضافي (المواسم + الممثلين + المقترحات)
            let extraHtml = '';
            if(type === 'tv') {
                extraHtml += `<div class="mb-12"><h3 class="text-2xl font-black mb-6 text-yellow-400">SEASONS</h3><div class="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                    ${data.seasons.map(s => s.season_number > 0 ? `<button onclick="loadEpisodes(${id}, ${s.season_number}, '${dataEn.original_name}')" class="season-btn active:bg-yellow-400 active:text-black">${s.name}</button>` : '').join('')}
                </div><div id="epGrid" class="grid grid-cols-2 md:grid-cols-5 gap-6 mt-10"></div></div>`;
            }

            extraHtml += `
                <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase">Top Cast</h3>
                <div class="flex gap-6 overflow-x-auto no-scrollbar mb-16">${data.credits.cast.slice(0,10).map(c => `<div class="text-center w-24 flex-shrink-0"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto"><p class="text-[10px] mt-2 font-bold">${c.name}</p></div>`).join('')}</div>
                <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase tracking-widest">Recommended</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6 pb-24">${data.similar.results.slice(0,16).map(s => `<div class="movie-card" onclick="showDetails(${s.id}, '${type}')"><img src="${IMG_URL+s.poster_path}" class="rounded-xl shadow-lg hover:border-yellow-400 border-2 border-transparent transition-all"></div>`).join('')}</div>
            `;

            document.getElementById('detailExtraContent').innerHTML = extraHtml;
            if(type === 'tv') loadEpisodes(id, data.seasons[data.seasons.length-1].season_number, dataEn.original_name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            document.getElementById('epGrid').innerHTML = data.episodes.map(ep => `<div class="movie-card w-full" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - Episode ${ep.episode_number}')"><img src="${ep.still_path ? IMG_URL+ep.still_path : 'https://via.placeholder.com/500x281'}" class="rounded-xl aspect-video object-cover shadow-lg border border-white/5"><h4 class="mt-2 text-xs font-bold text-center uppercase">EP ${ep.episode_number}</h4></div>`).join('');
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'SERVER 1', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'SERVER 2', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `server-btn ${i===0?'active' : ''} text-black bg-yellow-400 font-black px-10 py-3 rounded-xl`; b.innerText = v.n;
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchTopPicks(); fetchContent();
    </script>
</body>
</html>
