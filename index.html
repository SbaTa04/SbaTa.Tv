<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Golden Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { display: none; }

        /* نظام الفوكس للتلفاز */
        :focus { outline: 3px solid var(--main-yellow) !important; transform: scale(1.05) !important; z-index: 50; box-shadow: 0 0 20px var(--main-yellow); }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; padding-bottom: 50px; }
        
        .video-container { position: relative; width: 100%; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: #111; border: 1px solid var(--main-yellow); border-radius: 10px; min-width: 180px; z-index: 1000; }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 12px 15px; display: block; font-size: 14px; color: #ccc; cursor: pointer; text-align: right; font-weight: bold; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: rgba(0,0,0,0.8); color: var(--main-yellow); border-radius: 50%; z-index: 10; display: flex; items-center; justify-content: center; cursor: pointer; border: 1px solid var(--main-yellow); font-size: 1.5rem; }
        .btn-left { left: 10px; } .btn-right { right: 10px; }

        .logo-tv { background: var(--main-yellow); color: black; padding: 0 6px; border-radius: 4px; margin-right: 4px; font-weight: 900; }
        .glass-nav { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* تنسيق بطاقة الفيلم لمنع التداخل */
        .movie-card { transition: 0.3s; cursor: pointer; outline: none; border-radius: 12px; overflow: hidden; background: #111; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-2">
        <div class="flex items-center justify-between w-full md:w-auto gap-6">
            <div class="text-2xl font-black cursor-pointer" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-4 font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-sm md:text-base">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-sm md:text-base">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[75vh] flex items-end p-8 md:p-20 pb-16 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl text-right">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-4 uppercase italic drop-shadow-2xl text-white">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-yellow-400 text-black px-10 py-3 rounded-xl font-black text-lg md:text-2xl hover:scale-110 transition shadow-2xl">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20">
            <section class="mb-14">
                <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-400 uppercase italic"><span class="w-1.5 h-8 bg-yellow-400 block"></span> TOP PICKS</h2>
                <div class="relative group slider-container">
                    <div id="topPicksGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth"></div>
                    <div onclick="slide('topPicksGrid', -300)" class="slider-btn btn-left">❮</div>
                    <div onclick="slide('topPicksGrid', 300)" class="slider-btn btn-right">❯</div>
                </div>
            </section>

            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-yellow-400 pr-4 italic uppercase">Trending Now</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 xl:grid-cols-8 gap-4"></div>
            <div class="flex justify-center mt-20"><button onclick="loadNextPage()" class="bg-white/5 border border-yellow-400/20 text-white px-10 py-3 rounded-full font-bold hover:bg-yellow-400 hover:text-black transition shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل المصلحة -->
    <div id="detailPage" class="fade-in">
        <!-- زر الإغلاق بعيد عن المحتوى -->
        <button onclick="closeDetails()" class="fixed top-20 right-4 z-[10000] bg-yellow-400 text-black p-3 rounded-full text-2xl font-bold shadow-2xl transition hover:scale-110">&times;</button>
        
        <div class="relative min-h-[50vh] flex items-end p-6 md:p-16">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-20 transition-opacity">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
            <div class="relative z-10 flex flex-col md:flex-row gap-8 items-center w-full">
                <img id="detailPoster" src="" class="w-44 md:w-64 rounded-3xl shadow-2xl border-4 border-yellow-400/20">
                <div class="text-center md:text-right flex-1">
                    <h1 id="detailTitle" class="text-2xl md:text-5xl font-black mb-4 uppercase text-white leading-tight">...</h1>
                    <p id="detailStory" class="text-gray-200 text-sm md:text-xl leading-relaxed max-w-4xl font-bold italic mb-8">...</p>
                    <button id="detailPlayBtn" class="bg-yellow-400 text-black px-12 py-3 rounded-2xl font-black text-xl shadow-lg">▶ تشغيل</button>
                </div>
            </div>
        </div>

        <div class="px-6 md:px-16 mt-10">
            <div id="episodesSection" class="hidden mb-12">
                <h3 class="text-2xl font-black mb-6 text-yellow-400">EPISODES</h3>
                <div id="seasonsBar" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar"></div>
                <div id="episodesGrid" class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6"></div>
            </div>

            <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase tracking-widest">RECOMMENDATIONS</h3>
            <!-- شبكة المقترحات المنسقة بدون تداخل -->
            <div id="similarGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
        </div>
    </div>

    <!-- صفحة المشغل -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="bg-yellow-400 text-black px-8 py-2 rounded-xl font-black text-sm transition">← BACK</button>
            <h2 id="playerTitle" class="text-lg md:text-2xl font-bold truncate text-white uppercase px-6 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-12">
            <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-black text-black"></div>
            <div class="video-container shadow-[0_0_100px_rgba(250,204,21,0.2)]">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396, 115036]; 
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                const item = await res.json();
                if(item.poster_path) {
                    grid.innerHTML += `<div class="movie-card shrink-0 w-36 md:w-56" onclick="showDetails(${item.id}, 'tv')"><img src="${IMG_URL + item.poster_path}" class="rounded-2xl shadow-2xl border-2 border-transparent hover:border-yellow-400 transition-all"></div>`;
                }
            }
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.original_title || item.original_name || item.title;
                grid.innerHTML += `<div class="movie-card group" onclick="showDetails(${item.id}, '${currentType}')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg"><h3 class="mt-3 text-[11px] font-bold truncate text-center uppercase italic opacity-80">${title}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "Stream now on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id, currentType);
        }

        async function showDetails(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=similar`);
            const data = await res.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            document.getElementById('detailBg').src = data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path;
            document.getElementById('detailPoster').src = data.poster_path ? IMG_URL + data.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
            document.getElementById('detailTitle').innerText = dataEn.original_title || dataEn.original_name || dataEn.title;
            document.getElementById('detailStory').innerText = data.overview || "القصة غير متوفرة بالعربية.";

            const epSection = document.getElementById('episodesSection');
            if(type === 'tv') { epSection.classList.remove('hidden'); loadSeasons(data); } else { epSection.classList.add('hidden'); }

            document.getElementById('detailPlayBtn').onclick = () => { if(type === 'movie') setupServers(id, null, null, dataEn.original_title); else document.getElementById('seasonsBar').scrollIntoView({behavior:'smooth'}); };

            const simGrid = document.getElementById('similarGrid'); simGrid.innerHTML = '';
            data.similar.results.slice(0, 16).forEach(s => {
                if(s.poster_path) simGrid.innerHTML += `<div class="movie-card" onclick="showDetails(${s.id}, '${type}')"><img src="${IMG_URL + s.poster_path}" class="rounded-xl shadow-2xl border border-white/5 hover:border-yellow-400"></div>`;
            });
        }

        function loadSeasons(data) {
            const bar = document.getElementById('seasonsBar'); bar.innerHTML = '';
            data.seasons.forEach(s => { if(s.season_number === 0) return; const btn = document.createElement('button'); btn.className = "server-btn text-black bg-yellow-400"; btn.innerText = s.name; btn.onclick = () => loadEpisodes(data.id, s.season_number, data.original_name || data.name); bar.appendChild(btn); });
            loadEpisodes(data.id, data.seasons[data.seasons.length-1].season_number, data.original_name || data.name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid'); grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? IMG_URL + ep.still_path : 'https://via.placeholder.com/500x281?text=Episode';
                grid.innerHTML += `<div class="movie-card group" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName.toUpperCase()}')"><img src="${img}" class="rounded-xl aspect-video object-cover"><h4 class="mt-2 text-xs font-bold text-center">EP ${ep.episode_number}</h4></div>`;
            });
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'S1 VIP', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'S2 HD', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `server-btn ${i===0?'active' : ''} text-black bg-yellow-400 font-black px-8 py-3`; b.innerText = v.n;
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchTopPicks(); fetchContent();
    </script>
</body>
</html>
