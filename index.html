<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | الترجمة الاحترافية 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* نظام الفوكس للتلفاز */
        *:focus { outline: none !important; }
        *:focus-visible { outline: 3px solid var(--main-yellow) !important; border-radius: 12px; transform: scale(1.05) !important; z-index: 100; box-shadow: 0 0 30px var(--main-yellow); }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* القائمة المنسدلة */
        .dropdown-content {
            display: none; position: absolute; top: 100%; right: 0;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(25px);
            border: 1px solid var(--main-yellow); border-radius: 12px;
            min-width: 200px; box-shadow: 0 20px 50px rgba(0,0,0,1);
            z-index: 5000; overflow: hidden;
        }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 15px 20px; display: block; font-size: 16px; font-weight: 800; color: #fff; transition: 0.3s; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        /* السلايدر */
        .slider-btn {
            position: absolute; top: 0; bottom: 0; width: 45px;
            background: rgba(0,0,0,0.6); color: var(--main-yellow); display: flex;
            align-items: center; justify-content: center; z-index: 50;
            cursor: pointer; opacity: 0; transition: 0.4s; border: none; font-size: 2rem;
        }
        .slider-container:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: rgba(0,0,0,0.8); }
        .btn-left { left: 0; border-radius: 0 20px 20px 0; } 
        .btn-right { right: 0; border-radius: 20px 0 0 15px; }

        .movie-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; width: 140px; outline: none; }
        @media (min-width: 1025px) { .movie-card { width: 220px !important; } }
        .movie-img { width: 100%; aspect-ratio: 2/3; border-radius: 15px; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); }

        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 10; }
        
        .cast-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid var(--main-yellow); margin: 0 auto 5px; }
        .btn-gold { background: var(--main-yellow); color: black !important; font-weight: 900; padding: 12px 24px; border-radius: 12px; transition: 0.3s; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-10 right-10 z-[300] bg-yellow-400 text-black w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all opacity-0 hover:scale-110"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-sm md:text-xl px-2 py-1">MOVIES ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-sm md:text-xl px-2 py-1 transition">SERIES ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search Original Titles..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white font-bold transition-all">
    </nav>

    <!-- الصفحة الرئيسية -->
    <div id="homePage">
        <header id="mainHero" class="relative h-[60vh] md:h-[80vh] flex items-end p-8 md:p-20 pb-12 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40 transition-all">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30 text-right"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-4 uppercase italic drop-shadow-2xl text-white tracking-tighter">...</h1>
                <p id="heroDesc" class="text-gray-200 text-sm md:text-2xl leading-relaxed italic mb-10 border-r-4 border-yellow-400 pr-6 text-white font-bold">...</p>
                <button id="heroPlayBtn" class="btn-gold text-lg md:text-2xl px-12 shadow-2xl">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20 text-right">
            <section class="mb-14">
                <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-400 uppercase italic"><span class="w-1.5 h-8 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                <div class="relative group slider-container">
                    <div id="topPicksGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth"></div>
                    <div onclick="slide('topPicksGrid', -400)" class="slider-btn btn-left">❮</div>
                    <div onclick="slide('topPicksGrid', 400)" class="slider-btn btn-right">❯</div>
                </div>
            </section>
            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-yellow-400 pr-4 italic uppercase">Trending Now</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
            <div class="flex justify-center mt-20" id="loadMoreArea"><button onclick="loadNextPage()" class="btn-gold px-12 py-3 shadow-xl">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل (الرسم اليدوي) -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-20 right-6 z-[10000] btn-gold px-10 shadow-2xl">رجوع</button>
        <div id="detailDynamicContent"></div>
    </div>

    <!-- صفحة المشغل (تم إضافة تعليمات الترجمة) -->
    <div id="playerPage" class="fade-in pb-20 text-right">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="btn-gold px-6 py-1 text-sm">رجوع</button>
            <h2 id="playerTitle" class="text-sm md:text-xl font-bold truncate text-white uppercase px-4 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-black text-black"></div>
            
            <div class="video-container mb-6">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>

            <!-- نصيحة الترجمة -->
            <div class="bg-yellow-400/10 border border-yellow-400/20 p-4 rounded-xl mb-10 text-center">
                <p class="text-yellow-400 text-sm font-bold">💡 نصيحة: إذا كانت الترجمة غير واضحة أو غير متوافقة، اضغط على أيقونة (CC) أو الإعدادات (⚙️) داخل المشغل لتعديلها.</p>
            </div>

            <div id="playerInfo"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396]; 
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                const item = await res.json();
                grid.innerHTML += `<div class="movie-card" onclick="showDetails(${item.id}, 'tv')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border-2 border-transparent hover:border-yellow-400 transition-all w-full"></div>`;
            }
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            if(currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if(!isAppend) grid.innerHTML = '';
            grid.innerHTML += data.results.map(item => item.poster_path ? `<div class="movie-card group" onclick="showDetails(${item.id}, '${currentType}')"><img src="${IMG_URL + item.poster_path}" class="movie-img shadow-lg border border-white/5"><h3 class="mt-3 text-[10px] font-bold truncate text-center uppercase text-white/70">${item.original_title || item.original_name}</h3></div>` : '').join('');
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name;
            document.getElementById('heroDesc').innerText = item.overview || "Stream now on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id, currentType);
        }

        async function showDetails(id, type) {
            const resAr = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const dataAr = await resAr.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            
            let seasonsHtml = (type === 'tv' && dataAr.seasons) ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 mt-12"><div class="text-right"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic underline">Seasons</h3><div class="flex flex-col gap-3">${dataAr.seasons.filter(s=>s.season_number > 0).map(s => `<button onclick="loadEpisodes(${id}, ${s.season_number}, '${dataEn.original_name.replace(/'/g, "")}')" class="btn-gold text-sm">${s.name}</button>`).join('')}</div></div><div class="md:col-span-2 text-right"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic underline">Episodes</h3><div id="epGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div></div>` : '';

            document.getElementById('detailDynamicContent').innerHTML = `
                <div class="relative min-h-[55vh] flex items-center p-8 md:p-20 overflow-hidden text-right text-white">
                    <img src="${dataAr.backdrop_path ? IMG_ORG + dataAr.backdrop_path : ''}" class="absolute inset-0 w-full h-full object-cover opacity-30"><div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div><div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full"><img src="${IMG_URL + dataAr.poster_path}" class="w-56 rounded-3xl shadow-2xl border-4 border-yellow-400 shrink-0"><div class="flex-1"><h1 class="text-3xl md:text-7xl font-black mb-4 uppercase text-white leading-tight font-black italic">${dataEn.original_title || dataEn.original_name}</h1><p class="text-gray-200 text-sm md:text-2xl leading-relaxed italic mb-10 border-r-8 border-yellow-400 pr-10 text-white font-bold">${dataAr.overview || "القصة غير متوفرة."}</p><button id="finalPlayBtn" class="btn-gold px-12 py-3 text-xl shadow-xl">▶ شاهد الآن</button></div></div></div>
                <div class="px-8 md:px-24 mt-10 text-right">${seasonsHtml}<h3 class="text-2xl font-black mb-10 text-yellow-400 uppercase italic underline text-right text-white font-black">Top Cast</h3><div class="flex gap-8 overflow-x-auto no-scrollbar mb-16">${dataAr.credits.cast.slice(0,10).map(c => `<div class="cast-item text-center flex-shrink-0 w-24"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto shadow-xl"><p class="text-[10px] mt-2 font-bold text-white uppercase font-black">${c.name}</p></div>`).join('')}</div></div>`;
            
            document.getElementById('finalPlayBtn').onclick = () => setupServers(id, type==='tv'?'1':'null', type==='tv'?'1':'null', dataEn.original_title || dataEn.original_name, dataAr.overview?dataAr.overview.replace(/'/g, ""):"", type);
            if(type === 'tv' && dataAr.seasons.length > 0) loadEpisodes(id, dataAr.seasons[dataAr.seasons.length-1].season_number, dataEn.original_name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            document.getElementById('epGrid').innerHTML = data.episodes.map(ep => `<div class="movie-card w-full" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - EP ${ep.episode_number}', '${ep.overview?ep.overview.replace(/'/g, ""):""}', 'tv')"><img src="${ep.still_path ? IMG_URL+ep.still_path : 'https://via.placeholder.com/500x281'}" class="rounded-xl aspect-video object-cover shadow-lg"><h4 class="mt-2 text-xs font-bold text-center uppercase text-white font-black">EP ${ep.episode_number}</h4></div>`).join('');
        }

        // --- تحديث نظام السيرفرات لدعم الترجمة الاحترافية ---
        async function setupServers(id, s, e, title, desc, type) {
            const isTV = s !== null && s !== 'null';
            // أضفت روابط سيرفرات تدعم الترجمة العربية التلقائية
            const svs = [
                {n:'S1 (VIP - Auto Sub)', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}?sub_ar=1` : `https://vidsrc.to/embed/movie/${id}?sub_ar=1`},
                {n:'S2 (Stable Subs)', u: isTV ? `https://embed.su/embed/tv/${id}/${s}/${e}` : `https://embed.su/embed/movie/${id}`},
                {n:'S3 (Multi-Language)', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}
            ];
            
            document.getElementById('serverList').innerHTML = svs.map((v, i) => `<button class="btn-gold ${i===0?'active':''} text-sm px-10 py-2 rounded-xl font-black" onclick="document.getElementById('videoPlayer').src='${v.u}'">${v.n}</button>`).join('');

            const extraRes = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const extra = await extraRes.json();
            
            document.getElementById('playerInfo').innerHTML = `<div class="flex justify-between items-center mb-8 mt-10"><h1 class="text-3xl md:text-6xl font-black italic uppercase text-yellow-400 tracking-tighter">${title}</h1><div class="bg-yellow-400 text-black px-6 py-2 rounded-2xl font-black text-2xl shadow-xl">⭐ ${(extra.vote_average || 8.0).toFixed(1)}</div></div><p class="text-gray-200 text-lg md:text-3xl leading-relaxed italic font-bold border-r-8 border-yellow-400 pr-10 mb-16 font-black">${desc || "مشاهدة ممتعة."}</p><h3 class="text-3xl font-black mb-10 text-yellow-400 uppercase italic underline font-black">Recommended</h3><div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-6">${extra.similar.results.slice(0,16).map(s => `<div class="movie-card group w-full" onclick="closePlayer(); setTimeout(()=>showDetails(${s.id}, '${type}'),100)"><img src="${IMG_URL+s.poster_path}" class="movie-img shadow-2xl hover:border-yellow-400 transition-all border-2 border-transparent"></div>`).join('')}</div>`;
            document.getElementById('videoPlayer').src = svs[0].u;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerPage').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }
        init();
    </script>
</body>
</html>
