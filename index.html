<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | AI & ReelShort World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #e50914; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-red); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* Dropdowns */
        .dropdown-content {
            display: none; position: absolute; top: 100%; right: 0;
            background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(25px);
            border: 1px solid rgba(229, 9, 20, 0.4); border-radius: 15px;
            min-width: 200px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            z-index: 1000; overflow: hidden; padding: 10px 0;
        }
        .group:hover .dropdown-content { display: block; animation: fadeIn 0.3s ease; }
        .dropdown-item { padding: 12px 20px; display: block; font-size: 14px; font-weight: 700; color: #bbb; transition: 0.3s; text-align: right; border-right: 4px solid transparent; }
        .dropdown-item:hover { background: rgba(229, 9, 20, 0.15); color: white; border-right-color: var(--main-red); padding-right: 25px; }

        /* المشغل الذكي */
        .video-container { position: relative; width: 100%; background: #000; border-radius: 24px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.05); transition: 0.5s; }
        .ratio-16-9 { aspect-ratio: 16 / 9; }
        .ratio-9-16 { aspect-ratio: 9 / 16; max-width: 400px; margin: 0 auto; } 

        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .movie-card { transition: 0.4s; cursor: pointer; flex-shrink: 0; }
        .movie-card:hover { transform: translateY(-8px) scale(1.03); }

        .glass-nav { background: rgba(5, 8, 17, 0.97); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-red); color: white; padding: 2px 8px; border-radius: 6px; margin-right: 5px; font-style: italic; }
        
        #scrollTopBtn { opacity: 0; visibility: hidden; transition: 0.4s; }
        #scrollTopBtn.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <!-- زر الأعلى -->
    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-8 right-8 z-[300] bg-red-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></button>

    <!-- القائمة العلوية -->
    <nav class="fixed top-0 w-full z-[100] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter" onclick="location.reload()"><span class="text-white italic">SbaTa</span><span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-red-600 transition text-sm md:text-lg">أفلام ▾</button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('movie', '')" class="dropdown-item">✨ التريند والأحدث</a>
                        <a href="#" onclick="changeType('ai', '')" class="dropdown-item">🤖 أفلام الذكاء الاصطناعي</a>
                        <a href="#" onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 أفلام عربية</a>
                        <a href="#" onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أفلام أجنبية</a>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-red-600 transition text-sm md:text-lg">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <a href="#" onclick="changeType('tv', '')" class="dropdown-item">✨ أحدث المسلسلات</a>
                        <a href="#" onclick="changeType('reel', '')" class="dropdown-item">📱 ReelShort & Mini Drama</a>
                        <a href="#" onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 مسلسلات عربية</a>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search movies & AI titles..." class="bg-white/10 border border-white/20 rounded-full px-6 py-1.5 text-sm outline-none focus:border-red-600 w-full font-bold text-white shadow-xl">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[75vh] flex items-end p-8 md:p-20 pb-20 md:pb-28 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-opacity duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-4xl md:text-8xl font-black mb-4 leading-tight italic drop-shadow-2xl text-white uppercase">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-red-600 text-white px-10 py-3 md:px-14 md:py-4 rounded-2xl font-black text-lg md:text-2xl hover:scale-110 shadow-2xl transition-all">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-6 md:px-20 pb-20 -mt-16 md:-mt-20 relative z-20">
            <h2 id="gridTitle" class="text-2xl md:text-4xl font-black mb-10 border-r-8 border-red-600 pr-6 italic uppercase">LATEST RELEASES 2026</h2>
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-6 md:gap-10"></div>
            <div id="loadMoreArea" class="flex justify-center mt-20"><button onclick="loadNextPage()" class="bg-white/5 border border-white/10 text-white px-12 py-4 rounded-full font-black text-xl hover:bg-red-600 shadow-xl transition-all">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailPage" class="fade-in pb-20 text-right">
        <button onclick="closeDetails()" class="fixed top-24 left-8 z-[210] bg-white/10 p-5 rounded-full text-3xl font-bold backdrop-blur-md hover:bg-red-600 transition">&times;</button>
        <div class="relative h-[60vh] flex items-end p-8 md:p-20">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                <img id="detailPoster" src="" class="w-56 md:w-80 rounded-[30px] shadow-2xl border-4 border-white/5" onerror="this.src='https://via.placeholder.com/500x750?text=SbaTa+Tv'">
                <div class="max-w-4xl text-right">
                    <h1 id="detailTitle" class="text-3xl md:text-7xl font-black mb-6 italic leading-none uppercase">...</h1>
                    <p id="detailStory" class="text-gray-200 text-lg md:text-2xl leading-relaxed italic font-bold mb-8">...</p>
                    <button id="detailPlayBtn" class="bg-red-600 text-white px-10 py-3 rounded-xl font-black text-lg">▶ مشاهدة الآن</button>
                </div>
            </div>
        </div>
        <div class="px-8 md:px-20 mt-12" id="castArea">
            <!-- طاقم العمل يظهر هنا -->
        </div>
    </div>

    <!-- صفحة المشغل -->
    <div id="playerPage" class="fade-in">
        <nav class="p-6 md:px-12 flex items-center justify-between bg-black/50 backdrop-blur-md sticky top-0 z-[250] border-b border-white/5">
            <button onclick="closePlayer()" class="bg-red-600 px-8 py-2 rounded-xl font-black text-sm transition shadow-lg">← العودة</button>
            <h2 id="playerTitle" class="text-lg md:text-2xl font-bold truncate text-white italic px-4 uppercase">...</h2>
        </nav>
        <main class="max-w-[1500px] mx-auto p-6 md:p-12 text-right">
            <div class="flex gap-3 mb-6 overflow-x-auto pb-2 no-scrollbar font-bold" id="serverList"></div>
            <div id="playerContainer" class="video-container ratio-16-9 mb-10 shadow-[0_0_100px_rgba(229,9,20,0.2)]">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="bg-white/5 p-10 rounded-[40px] border border-white/10 mb-16 shadow-2xl">
                <h1 id="playerSubTitle" class="text-3xl md:text-6xl font-black italic mb-4 uppercase">...</h1>
                <p id="playerDesc" class="text-gray-300 text-xl leading-relaxed italic font-bold opacity-80">...</p>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const IMG_W500 = 'https://image.tmdb.org/t/p/w500';
        
        let currentType = 'movie'; 
        let currentPage = 1;
        let currentLanguage = '';

        // --- قاعدة بيانات أفلام AI و ReelShort المخصصة ---
        // يمكنك إضافة أي رابط من يوتيوب هنا وسيعمل فوراً
        const customLibrary = {
            ai: [
                { id: 'ai1', title: 'THE GENESIS: AI MOVIE', overview: 'أول فيلم متكامل تم إنتاجه بالكامل بواسطة الذكاء الاصطناعي، يصور صراع الآلات في المستقبل.', poster_path: 'https://images.unsplash.com/photo-1675435489119-3f0e74567e7a?w=500', video_url: 'https://www.youtube.com/embed/6_9C36C3-00' },
                { id: 'ai2', title: 'CYBERPUNK DREAM', overview: 'رحلة بصرية داخل أحلام الذكاء الاصطناعي في مدينة سايبربانك.', poster_path: 'https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=500', video_url: 'https://www.youtube.com/embed/example2' }
            ],
            reel: [
                { id: 'rs1', title: 'FATED TO ALPHA', overview: 'دراما ReelShort العمودية: قصة حب مستحيلة في عالم المستذئبين.', poster_path: 'https://m.media-amazon.com/images/M/MV5BMjA4NzUyNjc1MV5BMl5BanBnXkFtZTgwNjE2MDY0NjM@._V1_.jpg', video_url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', isVertical: true },
                { id: 'rs2', title: 'BILLIONAIRE SECRET', overview: 'مسلسل قصير عمودي يحكي قصة زواج سري من مليونير.', poster_path: 'https://m.media-amazon.com/images/M/MV5BNzQ2MzE3MTYtZGE4YS00YTM4LWI2MzctYmU0X2Y3MzU1ZGU0XkEyXkFqcGdeQXVyMTEyMjM2NDc2._V1_.jpg', video_url: 'https://www.youtube.com/embed/example3', isVertical: true }
            ]
        };

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };

        async function fetchContent(isAppend = false) {
            // التحقق إذا كان القسم مخصص (AI أو ReelShort)
            if(currentType === 'ai' || currentType === 'reel') {
                displayGrid(customLibrary[currentType], false);
                document.getElementById('loadMoreArea').style.display = 'none';
                return;
            }
            document.getElementById('loadMoreArea').style.display = 'flex';
            
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&sort_by=popularity.desc&page=${currentPage}`;
            if (currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid');
            if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                const img = item.poster_path.startsWith('http') ? item.poster_path : IMG_W500 + item.poster_path;
                const title = item.original_title || item.original_name || item.title;
                const card = document.createElement('div');
                card.className = 'movie-card group fade-in';
                card.onclick = () => item.video_url ? showDetailsCustom(item) : showDetailsTmdb(item.id);
                card.innerHTML = `<div class="relative rounded-[20px] overflow-hidden aspect-[2/3] shadow-2xl border-2 border-transparent group-hover:border-red-600 transition-all"><img src="${img}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700"></div><h3 class="mt-4 text-xs font-bold truncate text-center italic uppercase">${title}</h3>`;
                grid.appendChild(card);
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = IMG_URL + (item.backdrop_path || item.poster_path);
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "Exclusive content on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetailsTmdb(item.id);
        }

        async function showDetailsTmdb(id) {
            const res = await fetch(`${BASE_URL}/${currentType}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits`);
            const data = await res.json();
            fillDetails(data.original_title || data.original_name || data.title, data.overview, data.backdrop_path, data.poster_path, () => setupServers(id, data.original_title || data.title));
            
            // طاقم العمل لملء الفراغ
            document.getElementById('castArea').innerHTML = `<h3 class="text-2xl font-black mb-6 uppercase">Cast</h3><div class="flex gap-4 overflow-x-auto no-scrollbar">${data.credits.cast.slice(0, 10).map(c => `<div class="text-center w-24 shrink-0"><img src="${c.profile_path?IMG_W500+c.profile_path:'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-full mx-auto object-cover"><p class="text-[9px] mt-2">${c.name}</p></div>`).join('')}</div>`;
        }

        function showDetailsCustom(item) {
            fillDetails(item.title, item.overview, null, item.poster_path, () => openPlayer(item.video_url, item.title, item.overview, item.isVertical));
            document.getElementById('castArea').innerHTML = '';
        }

        function fillDetails(title, desc, bg, poster, playAction) {
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('detailPage').scrollTo(0,0);
            document.getElementById('detailBg').src = bg ? IMG_URL + bg : poster;
            document.getElementById('detailPoster').src = poster.startsWith('http') ? poster : IMG_W500 + poster;
            document.getElementById('detailTitle').innerText = title;
            document.getElementById('detailStory').innerText = desc || "No description available.";
            document.getElementById('detailPlayBtn').onclick = playAction;
        }

        function openPlayer(url, title, desc, isVertical) {
            const page = document.getElementById('playerPage');
            const container = document.getElementById('playerContainer');
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerSubTitle').innerText = title;
            document.getElementById('playerDesc').innerText = desc;
            
            // تحويل المشغل لوضع عمودي إذا كان ReelShort
            container.className = isVertical ? "video-container ratio-9-16" : "video-container ratio-16-9";
            
            page.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function setupServers(id, title) {
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            const svs = [{n:'S1', u:`https://vidsrc.to/embed/${currentType}/${id}`}, {n:'S2', u:`https://embed.su/embed/${currentType}/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button');
                b.className = `server-btn ${i===0?'active':''}`; b.innerText = v.n;
                b.onclick = (e) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title, "", false);
        }

        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow='auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; document.getElementById('gridTitle').innerText = t==='ai'?'AI CINEMA':t==='reel'?'REELSHORT DRAMA':'LATEST RELEASES'; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value;
            if(q.length > 2) {
                fetch(`${BASE_URL}/search/${currentType === 'ai' || currentType === 'reel' ? 'movie' : currentType}?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(res => res.json()).then(data => displayGrid(data.results, false));
            }
        });

        fetchContent();
    </script>
</body>
</html>
