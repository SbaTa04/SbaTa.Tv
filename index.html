<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما ستارز - عالم السينما في يدك</title>
    <!-- استدعاء أداة التصميم Tailwind وخط القاهرة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050811; color: white; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .movie-card:hover img { transform: scale(1.1); filter: brightness(0.6); }
        /* تصميم مخصص للمشغل ليكون متوافق مع الموبايل */
        .video-container { position: relative; width: 100%; max-width: 1000px; aspect-ratio: 16 / 9; background: black; border-radius: 15px; overflow: hidden; box-shadow: 0 0 50px rgba(220, 38, 38, 0.3); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- القائمة العلوية الثابتة -->
    <nav class="fixed top-0 w-full z-[100] glass px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-red-600 tracking-tighter cursor-pointer" onclick="location.reload()">CINEMA STARS</div>
        
        <div class="flex items-center gap-4">
            <div class="relative hidden md:block">
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم..." 
                    class="bg-gray-900/80 border border-gray-700 rounded-full px-5 py-2 text-sm focus:outline-none focus:border-red-600 w-64 transition-all">
            </div>
            <button class="bg-red-600 hover:bg-red-700 text-white p-2 rounded-full md:hidden" onclick="document.getElementById('searchInput').focus()">🔍</button>
        </div>
    </nav>

    <!-- واجهة الفيلم الرئيسي (Hero) -->
    <header id="hero" class="relative h-screen flex items-center p-8 md:p-16 overflow-hidden">
        <div class="z-10 max-w-3xl">
            <h1 id="heroTitle" class="text-5xl md:text-7xl font-bold mb-4">...</h1>
            <p id="heroDesc" class="text-gray-300 text-lg mb-8 line-clamp-3 md:line-clamp-none">...</p>
            <div class="flex gap-4">
                <button id="heroPlayBtn" class="bg-white text-black px-10 py-4 rounded-2xl font-bold hover:bg-red-600 hover:text-white transition-all duration-300 flex items-center gap-2 text-xl">
                    <span>▶</span> مشاهدة الآن
                </button>
            </div>
        </div>
        <div class="absolute inset-0 z-0">
            <img id="heroImg" src="" class="w-full h-full object-cover opacity-50 transition-opacity duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/20"></div>
        </div>
    </header>

    <!-- شبكة الأفلام -->
    <main class="p-8 md:p-16">
        <h2 id="gridTitle" class="text-3xl font-bold mb-10 border-r-8 border-red-600 pr-4">الأفلام الأكثر شهرة</h2>
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-8">
            <!-- الأفلام تظهر هنا -->
        </div>
    </main>

    <!-- مودال مشغل الفيديو (النافذة المنبثقة) -->
    <div id="videoModal" class="fixed inset-0 z-[200] hidden bg-black/95 flex items-center justify-center p-4 transition-opacity duration-500">
        <button onclick="closeVideo()" class="absolute top-6 left-6 text-white text-5xl hover:text-red-600 transition">&times;</button>
        <div class="video-container">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657'; // مفتاحك الذي استخرجته
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_PATH = 'https://image.tmdb.org/t/p/original';
        
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');

        // 1. دالة جلب البيانات من TMDB
        async function fetchMovies(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                displayMovies(data.results);
                if (data.results[0]) updateHero(data.results[0]);
            } catch (error) { console.error("خطأ في الاتصال"); }
        }

        // 2. دالة عرض الأفلام في الشبكة
        function displayMovies(movies) {
            movieGrid.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card group cursor-pointer transition-all duration-300';
                card.onclick = () => openVideo(movie.id);
                card.innerHTML = `
                    <div class="relative overflow-hidden rounded-3xl shadow-2xl aspect-[2/3]">
                        <img src="${IMG_PATH + movie.poster_path}" class="w-full h-full object-cover transition-all duration-500">
                        <div class="absolute inset-0 bg-red-600/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="text-white text-4xl transform scale-0 group-hover:scale-100 transition-transform">▶</span>
                        </div>
                        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-yellow-400 text-xs font-bold">
                            ★ ${movie.vote_average.toFixed(1)}
                        </div>
                    </div>
                    <h3 class="mt-4 text-sm font-bold truncate pr-2 group-hover:text-red-500 transition-colors">${movie.title}</h3>
                    <p class="text-[10px] text-gray-500 pr-2 mt-1">${movie.release_date.split('-')[0]}</p>
                `;
                movieGrid.appendChild(card);
            });
        }

        // 3. تحديث واجهة الـ Hero بأحدث فيلم
        function updateHero(movie) {
            document.getElementById('heroImg').src = IMG_PATH + movie.backdrop_path;
            document.getElementById('heroTitle').innerText = movie.title;
            document.getElementById('heroDesc').innerText = movie.overview;
            document.getElementById('heroPlayBtn').onclick = () => openVideo(movie.id);
        }

        // 4. فتح مشغل الفيديو
        function openVideo(movieId) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            // رابط السيرفر العالمي للمشاهدة
            player.src = `https://vidsrc.me/embed/movie?tmdb=${movieId}`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // 5. إغلاق مشغل الفيديو
        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = '';
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // 6. تفعيل البحث
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && searchInput.value !== '') {
                const query = searchInput.value;
                document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
                fetchMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${query}&language=ar-SA`);
                window.scrollTo(0, 800);
            }
        });

        // تشغيل الموقع في البداية
        fetchMovies(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA&page=1`);
    </script>
</body>
</html>
