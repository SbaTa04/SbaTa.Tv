<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Live TV & Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--main-yellow); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: #111; border: 1px solid var(--main-yellow); border-radius: 12px; min-width: 180px; z-index: 5000; overflow: hidden; }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 12px 20px; display: block; font-size: 15px; font-weight: 800; color: #fff; text-align: right; border-bottom: 1px solid #222; cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }
        .movie-card { transition: 0.4s; flex-shrink: 0; width: 140px; outline: none; }
        @media (min-width: 1024px) { .movie-card { width: 190px !important; } }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }
        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .btn-gold { background: var(--main-yellow); color: black; font-weight: 900; padding: 10px 20px; border-radius: 10px; transition: 0.3s; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 45px; height: 45px; background: rgba(0,0,0,0.6); color: var(--main-yellow); border-radius: 50%; z-index: 50; cursor: pointer; opacity: 0.8; border: none; font-size: 2rem; display: flex; align-items: center; justify-content: center; }
        .btn-left { left: 10px; } .btn-right { right: 10px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-2">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-sm md:text-xl px-2 py-1">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-sm md:text-xl px-2 py-1 transition">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 تركية</div>
                        <div onclick="changeType('channels', '')" class="dropdown-item text-yellow-400">📡 قنوات مباشرة</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search movies, series..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white font-bold">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header id="mainHero" class="relative h-[60vh] md:h-[80vh] flex items-end p-8 md:p-20 pb-12 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-2 uppercase italic drop-shadow-2xl text-white leading-tight tracking-tighter">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-4 line-clamp-2 font-bold italic">...</p>
                <button id="heroPlayBtn" class="btn-gold text-lg md:text-2xl px-12 shadow-2xl">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20">
            <div id="homeSections">
                <section class="mb-14">
                    <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-400 uppercase italic"><span class="w-1.5 h-8 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                    <div class="relative group slider-container">
                        <div id="topPicksGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth"></div>
                        <div onclick="slide('topPicksGrid', -400)" class="slider-btn btn-left">❮</div>
                        <div onclick="slide('topPicksGrid', 400)" class="slider-btn btn-right">❯</div>
                    </div>
                </section>
            </div>
            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-yellow-400 pr-4 italic uppercase">Trending Now</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
            <div class="flex justify-center mt-20" id="loadMoreArea"><button onclick="loadNextPage()" class="bg-white/5 border border-yellow-400/20 text-white px-10 py-3 rounded-full font-bold hover:bg-yellow-400 hover:text-black transition">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-20 right-6 z-[10000] btn-gold px-6 shadow-2xl">رجوع</button>
        <div id="detailDynamicContent"></div>
    </div>

    <!-- صفحة المشغل -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="btn-gold px-6 py-1 text-sm">رجوع</button>
            <h2 id="playerTitle" class="text-sm md:text-xl font-bold truncate text-white uppercase px-4 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-black text-black"></div>
            <div class="video-container mb-10"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div id="playerInfo" class="bg-white/5 p-6 md:p-10 rounded-[30px] border border-white/10 shadow-2xl text-right"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';

        // --- قاعدة بيانات القنوات المباشرة (Manual IPTV List) ---
        // يمكنك إضافة أي رابط قناة هنا (Embed URL)
        const liveChannels = [
            { id: 'c1', name: 'BeIN SPORTS News', original_title: 'BEIN SPORTS', overview: 'بث مباشر لقناة بي إن سبورت الإخبارية.', poster_path: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/BeIN_Sports_logo.svg/1200px-BeIN_Sports_logo.svg.png', video_url: 'https://vaughn.live/embed/video/beinsportsnews' },
            { id: 'c2', name: 'MBC 1', original_title: 'MBC 1 LIVE', overview: 'البث المباشر لقناة إم بي سي 1.', poster_path: 'https://upload.wikimedia.org/wikipedia/ar/thumb/7/70/MBC1_Logo.svg/1200px-MBC1_Logo.svg.png', video_url: 'https://www.elahmad.com/tv/embed/mbc1.php' },
            { id: 'c3', name: 'Al Jazeera News', original_title: 'AL JAZEERA', overview: 'بث مباشر لقناة الجزيرة الإخبارية.', poster_path: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Al_Jazeera_logo.svg/1200px-Al_Jazeera_logo.svg.png', video_url: 'https://www.youtube.com/embed/gCNeDWCI0vo' }
        ];

        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        // محرك البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value;
            const homeSec = document.getElementById('homeSections'), hero = document.getElementById('mainHero');
            if(q.length > 2) {
                homeSec.style.display = 'none'; hero.style.display = 'none';
                fetch(`${BASE_URL}/search/${currentType === 'channels' ? 'movie' : currentType}?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(r => r.json()).then(d => { displayGrid(d.results, false); });
            } else if(q.length === 0) {
                homeSec.style.display = 'block'; hero.style.display = 'flex'; fetchContent();
            }
        });

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396]; 
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                const item = await res.json();
                grid.innerHTML += `<div class="movie-card" onclick="showDetails(${item.id}, 'tv')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border-2 border-transparent hover:border-yellow-400 transition-all"></div>`;
            }
        }

        async function fetchContent(isAppend = false) {
            if(currentType === 'channels') {
                displayGrid(liveChannels, false);
                document.getElementById('loadMoreArea').style.display = 'none';
                return;
            }
            document.getElementById('loadMoreArea').style.display = 'flex';
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                const img =
