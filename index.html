<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Golden Cinema Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { display: none; }

        /* نظام الفوكس للتلفاز */
        :focus { outline: 4px solid var(--main-yellow) !important; transform: scale(1.05) !important; z-index: 100; border-radius: 15px; box-shadow: 0 0 30px var(--main-yellow); }

        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; }
        
        /* القوائم المنسدلة الاحترافية */
        .dropdown-content {
            display: none; position: absolute; top: 100%; right: 0;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(25px);
            border: 2px solid var(--main-yellow); border-radius: 12px;
            min-width: 200px; box-shadow: 0 20px 50px rgba(0,0,0,1);
            z-index: 5000; overflow: hidden;
        }
        .group:hover .dropdown-content { display: block; animation: fadeIn 0.3s ease; }
        .dropdown-item { padding: 15px 20px; display: block; font-size: 16px; font-weight: 800; color: #fff; transition: 0.3s; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        /* أزرار السلايدر - الجانبية (نتفليكس) */
        .slider-btn {
            position: absolute; top: 0; bottom: 0; width: 60px;
            background: rgba(0,0,0,0.7); color: var(--main-yellow); display: flex;
            align-items: center; justify-content: center; z-index: 50;
            cursor: pointer; opacity: 0; transition: 0.4s; border: none; font-size: 3rem;
        }
        .slider-container:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: var(--main-yellow); color: black; }
        .btn-left { left: 0; border-radius: 0 20px 20px 0; } 
        .btn-right { right: 0; border-radius: 20px 0 0 20px; }

        /* البطاقات الموحدة */
        .movie-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; width: 160px; outline: none; }
        @media (min-width: 1025px) { .movie-card { width: 220px !important; } }

        .glass-nav { background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-tv { background: var(--main-yellow); color: black; padding: 0 10px; border-radius: 8px; margin-right: 5px; font-weight: 900; }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-4 flex flex-col md:flex-row justify-between items-center glass-nav gap-4">
        <div class="flex items-center justify-between w-full md:w-auto gap-10">
            <div class="text-3xl md:text-5xl font-black cursor-pointer tracking-tighter" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-8 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-xl md:text-2xl">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 أفلام عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أفلام أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-xl md:text-2xl">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 مسلسلات عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 مسلسلات أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 مسلسلات تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search Original Titles..." class="bg-white/10 border-2 border-yellow-400/30 rounded-full px-8 py-2 text-xl outline-none focus:border-yellow-400 w-full md:w-[500px] text-white font-bold">
    </nav>

    <!-- Main Content -->
    <div id="homePage">
        <header class="relative h-[60vh] md:h-[80vh] flex items-end p-8 md:p-24 pb-20 overflow-hidden">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-5xl text-right">
                <h1 id="heroTitle" class="text-3xl md:text-8xl font-black mb-4 uppercase italic text-white leading-tight">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-2xl mb-8 line-clamp-3 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-yellow-400 text-black px-12 py-4 md:px-16 md:py-6 rounded-2xl font-black text-xl md:text-3xl shadow-2xl hover:scale-110 transition">▶ شاهد الآن</button>
            </div>
        </header>

        <main class="px-6 md:px-24 pb-32 -mt-10 relative z-20">
            <!-- TOP PICKS Slider -->
            <section class="mb-20">
                <h2 class="text-2xl md:text-4xl font-black mb-8 flex items-center gap-4 text-yellow-400 italic uppercase"><span class="w-2 h-10 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                <div class="slider-container relative group">
                    <button onclick="slide('topPicksGrid', -600)" class="slider-btn btn-left">❮</button>
                    <div id="topPicksGrid" class="flex gap-6 md:gap-10 overflow-x-auto no-scrollbar pb-6 scroll-smooth"></div>
                    <button onclick="slide('topPicksGrid', 600)" class="slider-btn btn-right">❯</button>
                </div>
            </section>

            <!-- COMING SOON Slider -->
            <section class="mb-20">
                <h2 class="text-2xl md:text-4xl font-black mb-8 flex items-center gap-4 text-white uppercase italic"><span class="w-2 h-10 bg-white block shadow-[0_0_15px_white]"></span> COMING SOON</h2>
                <div class="slider-container relative group">
                    <button onclick="slide('comingSoonGrid', -600)" class="slider-btn btn-left">❮</button>
                    <div id="comingSoonGrid" class="flex gap-6 md:gap-10 overflow-x-auto no-scrollbar pb-6 scroll-smooth"></div>
                    <button onclick="slide('comingSoonGrid', 600)" class="slider-btn btn-right">❯</button>
                </div>
            </section>

            <h2 id="gridTitle" class="text-2xl md:text-5xl font-black mb-12 border-r-8 border-yellow-400 pr-6 uppercase italic">TRENDING NOW</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-8"></div>
            <div class="flex justify-center mt-24"><button onclick="loadNextPage()" class="bg-white/5 border-2 border-yellow-400/20 text-white px-16 py-5 rounded-full font-black text-2xl hover:bg-yellow-400 hover:text-black transition shadow-xl">Explore More ↓</button></div>
        </main>
    </div>

    <!-- Detail & Player -->
    <div id="detailPage" class="fade-in pb-20">
        <button onclick="closeDetails()" class="fixed top-24 left-8 z-[10000] bg-yellow-400 text-black p-4 rounded-full text-3xl font-bold shadow-2xl transition hover:scale-110">&times;</button>
        <div class="relative min-h-[60vh] md:min-h-[80vh] flex items-end p-8 md:p-24">
            <img id="detailBg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
            <div class="relative z-10 flex flex-col md:flex-row gap-12 items-center w-full text-right">
                <img id="detailPoster" src="" class="w-64 md:w-96 rounded-[40px] shadow-2xl border-4 border-yellow-400/20">
                <div class="flex-1">
                    <h1 id="detailTitle" class="text-4xl md:text-8xl font-black mb-6 uppercase italic text-white leading-tight">...</h1>
                    <p id="detailStory" class="text-gray-200 text-lg md:text-3xl leading-relaxed max-w-5xl font-bold italic mb-10">...</p>
                    <button id="detailPlayBtn" class="bg-yellow-400 text-black px-14 py-4 md:px-20 md:py-6 rounded-2xl font-black text-xl md:text-3xl shadow-2xl hover:scale-110">▶ شاهد الآن</button>
                </div>
            </div>
        </div>
        <div class="px-8 md:px-24 mt-20 text-right">
            <div id="episodesSection" class="hidden mb-20">
                <h3 class="text-3xl md:text-5xl font-black mb-10 text-yellow-400">EPISODES</h3>
                <div id="seasonsBar" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
                <div id="episodesGrid" class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-10 mt-10"></div>
            </div>
            <h3 class="text-3xl md:text-5xl font-black mb-12 uppercase text-yellow-400">Recommendations</h3>
            <div id="similarGrid" class="grid grid-cols-2 md:grid-cols-6 lg:grid-cols-8 gap-8 pb-24"></div>
        </div>
    </div>

    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-6 md:p-10 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="bg-yellow-400 text-black px-10 py-3 rounded-2xl font-black text-xl">← BACK</button>
            <h2 id="playerTitle" class="text-xl md:text-4xl font-bold truncate text-white uppercase px-6 italic">...</h2>
        </nav>
        <main class="max-w-[1500px] mx-auto p-6 md:p-12">
            <div id="serverList" class="flex gap-4 mb-10 overflow-x-auto no-scrollbar font-black"></div>
            <div class="video-container shadow-[0_0_100px_rgba(250,204,21,0.3)]"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        // البحث المباشر
        document.getElementById('searchInput').addEventListener('input', (e) => {
            if(e.target.value.length > 2) {
                fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${e.target.value}&language=en-US`)
                .then(r => r.json()).then(d => displayGrid(d.results, false));
            }
        });

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396, 115036]; 
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                try {
                    const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                    const item = await res.json();
                    if(item.poster_path) {
                        grid.innerHTML += `<div class="movie-card group" tabindex="0" onclick="openItemById(${item.id}, 'tv')"><div class="relative rounded-[30px] overflow-hidden aspect-[2/3] shadow-2xl border-4 border-white/5 group-hover:border-yellow-400 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
                    }
                } catch(e) {}
            }
        }

        async function fetchComingSoon() {
            const res = await fetch(`${BASE_URL}/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`);
            const data = await res.json();
            const grid = document.getElementById('comingSoonGrid'); grid.innerHTML = '';
            data.results.forEach(item => {
                if(!item.poster_path) return;
                grid.innerHTML += `<div class="movie-card" tabindex="0" onclick="openItemById(${item.id}, 'movie')"><div class="relative rounded-[30px] overflow-hidden aspect-[2/3] shadow-2xl border-4 border-white/5 group-hover:border-yellow-400 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover"></div></div>`;
            });
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.original_title || item.original_name || item.title;
                const year = (item.release_date || item.first_air_date || "2026").split('-')[0];
                grid.innerHTML += `<div class="movie-card group w-full" tabindex="0" onclick="openItemById(${item.id}, '${currentType}')"><div class="relative rounded-[30px] overflow-hidden aspect-[2/3] shadow-2xl border-2 border-transparent group-hover:border-yellow-400 transition-all"><img src="${IMG_URL + item.poster_path}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"><div class="absolute top-4 right-4 bg-yellow-400 text-black text-xs font-black px-3 py-1 rounded-lg z-10">${year}</div></div><h3 class="mt-4 text-sm font-bold truncate text-center uppercase italic text-white/70">${title}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name || item.title;
            document.getElementById('heroDesc').innerText = item.overview || "حصرياً على SbaTa Tv - استمتع بأقوى العروض العالمية.";
            document.getElementById('heroPlayBtn').onclick = () => openItemById(item.id, currentType);
        }

        async function openItemById(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=similar`);
            const data = await res.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            document.getElementById('detailBg').src = data.backdrop_path ? IMG_ORG + data.backdrop_path : IMG_ORG + data.poster_path;
            document.getElementById('detailPoster').src = data.poster_path ? IMG_URL + data.poster_path : 'https://via.placeholder.com/500x750?text=SbaTa+Tv';
            document.getElementById('detailTitle').innerText = dataEn.original_title || dataEn.original_name || dataEn.title;
            document.getElementById('detailStory').innerText = data.overview || "القصة غير متوفرة بالعربية حالياً.";

            const epSection = document.getElementById('episodesSection');
            if(type === 'tv') { epSection.classList.remove('hidden'); loadSeasons(data); } else { epSection.classList.add('hidden'); }

            document.getElementById('detailPlayBtn').onclick = () => { if(type === 'movie') setupServers(id, null, null, dataEn.original_title || dataEn.title); else document.getElementById('seasonsBar').scrollIntoView({behavior:'smooth'}); };

            const simGrid = document.getElementById('similarGrid'); simGrid.innerHTML = '';
            data.similar.results.slice(0, 16).forEach(s => { if(s.poster_path) simGrid.innerHTML += `<div class="movie-card group" tabindex="0" onclick="openItemById(${s.id}, '${type}')"><img src="${IMG_URL + s.poster_path}" class="rounded-[30px] w-full h-full object-cover shadow-2xl border-2 border-white/5 hover:border-yellow-400"></div>`; });
        }

        function loadSeasons(data) {
            const bar = document.getElementById('seasonsBar'); bar.innerHTML = '';
            data.seasons.forEach(s => { if(s.season_number === 0) return; const btn = document.createElement('button'); btn.className = "server-btn text-xl px-12 py-4 text-black bg-yellow-400"; btn.innerText = s.name; btn.tabIndex="0"; btn.onclick = () => loadEpisodes(data.id, s.season_number, data.original_name || data.name); bar.appendChild(btn); });
            loadEpisodes(data.id, data.seasons[data.seasons.length-1].season_number, data.original_name || data.name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            const grid = document.getElementById('episodesGrid'); grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? IMG_URL + ep.still_path : 'https://via.placeholder.com/500x281?text=Episode';
                grid.innerHTML += `<div class="movie-card w-full" tabindex="0" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName.toUpperCase()} - EP ${ep.episode_number}')"><div class="aspect-video rounded-[30px] overflow-hidden border-4 border-white/5 shadow-2xl group-hover:border-yellow-400"><img src="${img}" class="w-full h-full object-cover"></div><h4 class="mt-4 text-lg font-bold text-center uppercase">EP ${ep.episode_number}</h4></div>`;
            });
        }

        function setupServers(id, s, e, title) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'SERVER 1', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'SERVER 2', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `server-btn ${i===0?'active' : ''} text-black bg-yellow-400 font-black px-12 py-4`; b.innerText = v.n; b.tabIndex="0";
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentLanguage=l; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchTopPicks(); fetchComingSoon(); fetchContent();
    </script>
</body>
</html>
