<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما ستارز - عالم الأفلام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050811; color: white; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        .movie-card:hover img { transform: scale(1.08); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="sticky top-0 z-50 glass p-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-3xl font-bold text-red-600 tracking-tighter cursor-pointer" onclick="location.reload()">CINEMA STARS</div>
        
        <div class="relative w-full md:w-96">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." 
                class="w-full bg-gray-900 border border-gray-700 rounded-full px-6 py-2 text-sm focus:outline-none focus:border-red-600 transition-all">
            <button id="searchBtn" class="absolute left-2 top-1 bg-red-600 p-1.5 rounded-full hover:bg-red-700 transition">
                🔍
            </button>
        </div>
    </nav>

    <!-- واجهة عرض كبرى (Hero Section) -->
    <header class="relative h-[50vh] md:h-[70vh] flex items-center p-8 overflow-hidden">
        <div class="z-10 max-w-2xl">
            <span class="bg-red-600 text-xs px-3 py-1 rounded-full font-bold mb-4 inline-block">حصرياً</span>
            <h1 id="heroTitle" class="text-4xl md:text-6xl font-bold mb-4 text-white">أفضل تجربة سينمائية</h1>
            <p id="heroDesc" class="text-gray-300 text-sm md:text-lg mb-6 line-clamp-3">اكتشف أحدث الأفلام والمسلسلات العالمية المترجمة للعربية بجودة عالية.</p>
            <div class="flex gap-4">
                <button class="bg-white text-black px-8 py-3 rounded-xl font-bold hover:bg-gray-200 transition">▶ مشاهدة الآن</button>
                <button class="glass px-8 py-3 rounded-xl font-bold hover:bg-white/10 transition">＋ قائمتي</button>
            </div>
        </div>
        <div class="absolute inset-0 z-0">
            <img id="heroImg" src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=1600&q=80" 
                class="w-full h-full object-cover opacity-40 transition-all duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/50"></div>
        </div>
    </header>

    <!-- قسم الأفلام -->
    <main class="p-6 md:p-12">
        <div class="flex justify-between items-center mb-10">
            <h2 id="sectionTitle" class="text-2xl font-bold border-r-4 border-red-600 pr-4 italic">الأفلام الرائجة الآن</h2>
            <div class="text-red-500 text-sm font-bold cursor-pointer hover:underline">مشاهدة الكل ←</div>
        </div>

        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- الأفلام سيتم توليدها هنا بواسطة الجافاسكريبت -->
        </div>
    </main>

    <footer class="p-10 text-center border-t border-gray-800 text-gray-500 text-sm">
        <p>© 2024 سينما ستارز - جميع الحقوق محفوظة لـ Sbata04</p>
    </footer>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const sectionTitle = document.getElementById('sectionTitle');

        // دالة لجلب الأفلام وعرضها
        async function getMovies(url, isSearch = false) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if(data.results.length === 0) {
                    movieGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20">عذراً، لم نجد ما تبحث عنه..</p>';
                    return;
                }

                displayMovies(data.results);
                
                // تحديث الـ Hero بأول فيلم في النتائج إذا كانت صفحة رئيسية
                if(!isSearch) updateHero(data.results[0]);

            } catch (error) {
                console.error("خطأ في الاتصال بالسيرفر");
            }
        }

        function displayMovies(movies) {
            movieGrid.innerHTML = '';
            movies.forEach(movie => {
                const { title, poster_path, vote_average, release_date } = movie;
                const movieEl = document.createElement('div');
                movieEl.classList.add('movie-card', 'group', 'cursor-pointer');
                
                movieEl.innerHTML = `
                    <div class="relative overflow-hidden rounded-2xl shadow-lg aspect-[2/3]">
                        <img src="${poster_path ? IMG_URL+poster_path : 'https://via.placeholder.com/500x750?text=لا+يوجد+بوستر'}" 
                             class="w-full h-full object-cover transition-transform duration-500" alt="${title}">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4">
                            <button class="bg-red-600 text-white font-bold py-2 rounded-xl text-xs translate-y-4 group-hover:translate-y-0 transition-transform shadow-lg">مشاهدة</button>
                        </div>
                        <div class="absolute top-2 right-2 glass px-2 py-1 rounded-lg text-yellow-400 text-[10px] font-bold">
                            ★ ${vote_average.toFixed(1)}
                        </div>
                    </div>
                    <div class="mt-3">
                        <h3 class="text-xs md:text-sm font-bold truncate group-hover:text-red-500 transition-colors">${title}</h3>
                        <p class="text-[10px] text-gray-500 mt-1">${release_date ? release_date.split('-')[0] : 'قريباً'}</p>
                    </div>
                `;
                movieGrid.appendChild(movieEl);
            });
        }

        function updateHero(movie) {
            document.getElementById('heroTitle').innerText = movie.title;
            document.getElementById('heroDesc').innerText = movie.overview;
            document.getElementById('heroImg').src = 'https://image.tmdb.org/t/p/original' + movie.backdrop_path;
        }

        // تفعيل ميزة البحث
        searchInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const query = searchInput.value;
                if(query) {
                    sectionTitle.innerText = `نتائج البحث عن: ${query}`;
                    getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${query}&language=ar-SA`, true);
                    window.scrollTo(0, 500);
                }
            }
        });

        // تشغيل الصفحة لأول مرة (عرض الأفلام الشائعة)
        getMovies(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA&page=1`);
    </script>
</body>
</html>
