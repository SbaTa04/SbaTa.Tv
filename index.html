<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | Cinema & Live TV 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        /* تأثيرات الظهور */
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* نظام الفوكس للتلفاز */
        *:focus { outline: none !important; }
        *:focus-visible { outline: 4px solid var(--main-yellow) !important; border-radius: 15px; transform: scale(1.05) !important; }

        /* الصفحات المنبثقة */
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }

        /* --- تنسيق السلايدر الاحترافي (نتفليكس ستايل) --- */
        .slider-container { position: relative; width: 100%; padding: 0 40px; }
        .slider-row { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding: 20px 0; }
        
        .slider-btn { 
            position: absolute; top: 0; bottom: 0; width: 50px; 
            background: rgba(0,0,0,0.7); color: var(--main-yellow); 
            z-index: 100; cursor: pointer; border: none; font-size: 2.5rem; 
            display: flex; items-center; justify-content: center; transition: 0.3s;
            opacity: 0;
        }
        .slider-container:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
        .btn-left { left: 0; border-radius: 0 20px 20px 0; }
        .btn-right { right: 0; border-radius: 20px 0 0 20px; }

        /* حجم البوستر - ثابت لمنع الانكماش */
        .movie-card { width: 160px; flex-shrink: 0; cursor: pointer; transition: 0.4s; outline: none; }
        @media (min-width: 1024px) { .movie-card { width: 220px !important; } }
        .movie-img { width: 100%; aspect-ratio: 2/3; border-radius: 15px; object-fit: cover; border: 2px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .movie-card:hover .movie-img { border-color: var(--main-yellow); transform: scale(1.05); }

        /* القنوات (دوائر كما في الرسم) */
        .channel-circle { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--main-yellow); overflow: hidden; flex-shrink: 0; cursor: pointer; transition: 0.3s; background: #000; margin: 0 auto; }
        .channel-circle:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--main-yellow); }

        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }
        .glass-nav { background: rgba(5, 8, 17, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .section-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; display: flex; items-center; gap: 12px; color: var(--main-yellow); padding-right: 40px; }
        .section-title span { width: 5px; height: 30px; background: var(--main-yellow); border-radius: 2px; }

        .btn-gold { background: var(--main-yellow); color: black !important; font-weight: 900; padding: 12px 28px; border-radius: 12px; transition: 0.3s; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-4 flex flex-col md:flex-row justify-between items-center glass-nav gap-3">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-4 text-xs md:text-sm font-bold uppercase">
                <button onclick="location.reload()" class="text-yellow-400">الرئيسية</button>
                <button onclick="changeType('movie')" class="hover:text-yellow-400">الأفلام</button>
                <button onclick="changeType('tv')" class="hover:text-yellow-400">المسلسلات</button>
                <button onclick="scrollToLive()" class="hover:text-yellow-400">القنوات</button>
            </div>
        </div>
        <div class="flex w-full md:w-auto gap-2">
            <input type="text" id="searchInput" placeholder="Search movies, series..." class="bg-white/10 border border-yellow-400/30 rounded-full px-6 py-2 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white font-bold">
            <button onclick="triggerSearch()" class="btn-gold !p-2 rounded-full">🔍</button>
        </div>
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header id="mainHero" class="relative h-[60vh] md:h-[80vh] flex items-end p-8 md:p-24 pb-20 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40 transition-all duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-5xl">
                <h1 id="heroTitle" class="text-4xl md:text-8xl font-black mb-4 uppercase italic drop-shadow-2xl text-white tracking-tighter">...</h1>
                <button id="heroPlayBtn" class="btn-gold text-lg md:text-3xl px-12 shadow-2xl">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="pb-32 mt-12 relative z-20">
            
            <!-- 1. قنوات البث المباشر (دوائر) -->
            <section class="mb-20" id="live-section">
                <h2 class="section-title"><span></span> قنوات البث المباشر</h2>
                <div class="flex gap-8 overflow-x-auto no-scrollbar px-10 pb-4" id="channelsGrid"></div>
            </section>

            <div id="homeSections">
                <!-- 2. آخر الأفلام المضافة -->
                <section class="mb-20 slider-container">
                    <h2 class="section-title"><span></span> آخر الأفلام المضافة</h2>
                    <div onclick="sideScroll('row-latest', -600)" class="slider-btn btn-left">❮</div>
                    <div class="slider-row no-scrollbar" id="row-latest"></div>
                    <div onclick="sideScroll('row-latest', 600)" class="slider-btn btn-right">❯</div>
                </section>

                <!-- 3. تريند -->
                <section class="mb-20 slider-container">
                    <h2 class="section-title"><span></span> تريند TRENDING</h2>
                    <div onclick="sideScroll('row-trending', -600)" class="slider-btn btn-left">❮</div>
                    <div class="slider-row no-scrollbar" id="row-trending"></div>
                    <div onclick="sideScroll('row-trending', 600)" class="slider-btn btn-right">❯</div>
                </section>
            </div>

            <!-- 4. استكشف المكتبة (شبكة كبيرة) -->
            <div class="px-10">
                <h2 id="gridTitle" class="section-title !p-0 mb-10"><span></span> استكشف المكتبة</h2>
                <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6"></div>
                <div class="flex justify-center mt-20" id="loadMoreArea">
                    <button onclick="loadNextPage()" class="bg-white/5 border-2 border-yellow-400 text-yellow-400 px-16 py-4 rounded-full font-black text-2xl hover:bg-yellow-400 hover:text-black transition shadow-xl uppercase">تحميل المزيد ↓</button>
                </div>
            </div>
        </main>
    </div>

    <!-- صفحة التفاصيل (رسم يدوي) -->
    <div id="detailPage" class="fade-in">
        <button onclick="closeDetails()" class="fixed top-24 right-8 z-[10000] btn-gold shadow-2xl px-10 py-3 text-xl">رجوع</button>
        <div id="detailDynamicContent"></div>
    </div>

    <!-- صفحة المشغل (VIP) -->
    <div id="playerPage" class="fade-in">
        <nav class="p-6 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="btn-gold px-10 py-2">رجوع</button>
            <h2 id="playerTitle" class="text-xl md:text-3xl font-black truncate text-white uppercase italic">...</h2>
        </nav>
        <main class="max-w-[1500px] mx-auto p-6 md:p-12">
            <div id="serverList" class="flex gap-4 mb-8 overflow-x-auto no-scrollbar"></div>
            <div class="video-container"><iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div id="playerInfo" class="mt-12 bg-white/5 p-10 rounded-[40px] border border-white/10 text-right"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';

        let currentType = 'movie', currentPage = 1;

        const liveChannels = [
            { name: 'BeIN News', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/BeIN_Sports_logo.svg/1200px-BeIN_Sports_logo.svg.png', url: 'https://vaughn.live/embed/video/beinsportsnews' },
            { name: 'MBC 1', img: 'https://upload.wikimedia.org/wikipedia/ar/thumb/7/70/MBC1_Logo.svg/1200px-MBC1_Logo.svg.png', url: 'https://www.elahmad.com/tv/embed/mbc1.php' },
            { name: 'Al Jazeera', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Al_Jazeera_logo.svg/1200px-Al_Jazeera_logo.svg.png', url: 'https://www.youtube.com/embed/gCNeDWCI0vo' }
        ];

        function sideScroll(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }
        function scrollToLive() { document.getElementById('live-section').scrollIntoView({behavior:'smooth'}); }

        // إصلاح البحث
        function triggerSearch() {
            const q = document.getElementById('searchInput').value;
            if(q.length > 2) {
                document.getElementById('homeSections').style.display = 'none';
                document.getElementById('mainHero').style.display = 'none';
                document.getElementById('live-section').style.display = 'none';
                document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${q.toUpperCase()}`;
                fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(r => r.json()).then(d => displayGrid(d.results, false));
                window.scrollTo(0,0);
            }
        }

        async function fetchRow(url, containerId, type) {
            const res = await fetch(url);
            const data = await res.json();
            document.getElementById(containerId).innerHTML = data.results.map(item => `
                <div class="movie-card" onclick="showDetails(${item.id}, '${type}')">
                    <img src="${IMG_URL + item.poster_path}" class="movie-img shadow-2xl" onerror="this.src='https://via.placeholder.com/500x750?text=SbaTa+Tv'">
                    <p class="text-[11px] md:text-sm mt-3 font-bold truncate text-center uppercase text-white/90">${item.original_title || item.original_name}</p>
                </div>
            `).join('');
            return data.results[0];
        }

        async function init() {
            document.getElementById('channelsGrid').innerHTML = liveChannels.map(c => `<div class="text-center shrink-0" onclick="openLivePlayer('${c.url}', '${c.name}')"><div class="channel-circle"><img src="${c.img}" class="w-full h-full object-contain p-4"></div><p class="text-sm mt-3 font-black uppercase text-yellow-400">${c.name}</p></div>`).join('');
            const hero = await fetchRow(`${BASE_URL}/movie/popular?api_key=${API_KEY}`, 'row-latest', 'movie');
            fetchRow(`${BASE_URL}/trending/all/week?api_key=${API_KEY}`, 'row-trending', 'movie');
            fetchContent();
            if(hero) {
                document.getElementById('heroImg').src = IMG_ORG + hero.backdrop_path;
                document.getElementById('heroTitle').innerText = hero.original_title;
                document.getElementById('heroPlayBtn').onclick = () => showDetails(hero.id, 'movie');
            }
        }

        async function showDetails(id, type) {
            const resAr = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const dataAr = await resAr.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            
            let seasonsHtml = '';
            if(type === 'tv' && dataAr.seasons) {
                seasonsHtml = `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 mt-16 text-right"><div class="text-right"><h3 class="text-3xl font-black text-yellow-400 mb-8 uppercase italic underline">Seasons</h3><div class="flex flex-col gap-4">${dataAr.seasons.filter(s=>s.season_number > 0).map(s => `<button onclick="loadEpisodes(${id}, ${s.season_number}, '${dataEn.original_name.replace(/'/g, "")}')" class="btn-gold text-right hover:pr-10 transition-all">${s.name}</button>`).join('')}</div></div><div class="md:col-span-2 text-right"><h3 class="text-3xl font-black text-yellow-400 mb-8 uppercase italic underline">Episodes</h3><div id="epGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div></div></div>`;
            }

            document.getElementById('detailDynamicContent').innerHTML = `
                <div class="relative min-h-[60vh] md:min-h-[80vh] flex items-center p-8 md:p-24 overflow-hidden text-right">
                    <img src="${dataAr.backdrop_path ? IMG_ORG + dataAr.backdrop_path : ''}" class="absolute inset-0 w-full h-full object-cover opacity-30">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
                    <div class="relative z-10 flex flex-col md:flex-row gap-12 items-center w-full">
                        <img src="${IMG_URL + dataAr.poster_path}" class="w-64 md:w-96 rounded-[40px] shadow-2xl border-4 border-yellow-400 shrink-0">
                        <div class="flex-1">
                            <h1 class="text-4xl md:text-8xl font-black mb-6 uppercase text-white tracking-tighter leading-none">${dataEn.original_title || dataEn.original_name}</h1>
                            <p class="text-gray-200 text-lg md:text-3xl leading-relaxed italic mb-12 border-r-8 border-yellow-400 pr-10 text-white font-bold">${dataAr.overview || "القصة غير متوفرة."}</p>
                            <button onclick="preparePlayer(${id}, ${type==='tv'?'1':'null'}, ${type==='tv'?'1':'null'}, '${dataEn.original_title || dataEn.original_name}', '${dataAr.overview?dataAr.overview.replace(/'/g, ""):""}', '${type}')" class="btn-gold px-20 py-5 text-3xl shadow-2xl">▶ WATCH NOW</button>
                        </div>
                    </div>
                </div>
                <div class="px-10 md:px-24 mt-20">
                    ${seasonsHtml}
                    <h3 class="text-3xl font-black mb-10 text-yellow-400 uppercase italic underline text-right">Top Cast</h3>
                    <div class="flex gap-10 overflow-x-auto no-scrollbar mb-20">${dataAr.credits.cast.slice(0,10).map(c => `<div class="cast-item text-center flex-shrink-0 w-32"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto shadow-2xl"><p class="text-sm mt-4 font-black text-white uppercase">${c.name}</p></div>`).join('')}</div>
                    <h3 class="text-3xl font-black mb-10 text-yellow-400 uppercase italic underline text-right">More Like This</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-6 pb-32">${dataAr.similar.results.slice(0,16).map(s => `<div class="movie-card" onclick="showDetails(${s.id}, '${type}')"><img src="${IMG_URL+s.poster_path}" class="movie-img shadow-2xl hover:border-yellow-400 border-2 border-transparent transition-all"></div>`).join('')}</div>
                </div>
            `;
            if(type === 'tv' && dataAr.seasons.length > 0) loadEpisodes(id, dataAr.seasons[dataAr.seasons.length-1].season_number, dataEn.original_name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            document.getElementById('epGrid').innerHTML = data.episodes.map(ep => `<div class="movie-card w-full" onclick="preparePlayer(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - Episode ${ep.episode_number}', '${ep.overview?ep.overview.replace(/'/g, ""):""}', 'tv')"><img src="${ep.still_path ? IMG_URL+ep.still_path : 'https://via.placeholder.com/500x281'}" class="rounded-xl aspect-video object-cover shadow-xl"><h4 class="mt-3 text-sm font-black text-center uppercase text-white">EP ${ep.episode_number}</h4></div>`).join('');
        }

        async function preparePlayer(id, s, e, title, desc, type) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null && s !== 'null';
            const svs = [{n:'VIP SERVER', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'HD MIRROR', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            
            document.getElementById('serverList').innerHTML = svs.map((v, i) => `<button class="btn-gold ${i===0?'active':''} text-xl px-12 py-3" onclick="document.getElementById('videoPlayer').src='${v.u}'">${v.n}</button>`).join('');

            const extraRes = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const extra = await extraRes.json();
            
            document.getElementById('playerInfo').innerHTML = `
                <div class="flex justify-between items-center mb-10"><h1 class="text-4xl md:text-7xl font-black italic uppercase text-yellow-400 tracking-tighter">${title}</h1><div class="bg-yellow-400 text-black px-8 py-3 rounded-2xl font-black text-3xl shadow-2xl">⭐ ${(extra.vote_average || 8.0).toFixed(1)}</div></div>
                <p class="text-gray-200 text-xl md:text-4xl leading-relaxed italic font-black border-r-[12px] border-yellow-400 pr-12 mb-20 text-right uppercase">${desc || "Enjoy watching on SbaTa Tv!"}</p>
                <h3 class="text-4xl font-black mb-12 text-yellow-400 uppercase italic underline text-right">Recommended for you</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-8">${extra.similar.results.slice(0,16).map(s => `<div class="movie-card" onclick="closePlayer(); setTimeout(()=>showDetails(${s.id}, '${type}'),100)"><img src="${IMG_URL+s.poster_path}" class="rounded-3xl shadow-2xl hover:border-yellow-400 border-4 border-transparent transition-all"></div>`).join('')}</div>
            `;
            document.getElementById('videoPlayer').src = svs[0].u;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerPage').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if(!isAppend) grid.innerHTML = '';
            grid.innerHTML += data.results.map(item => `<div class="movie-card group w-full" onclick="showDetails(${item.id}, '${currentType}')"><img src="${IMG_URL + item.poster_path}" class="movie-img shadow-2xl border-2 border-transparent group-hover:border-yellow-400"><h3 class="mt-4 text-sm font-black truncate text-center uppercase text-white/70">${item.original_title || item.original_name}</h3></div>`).join('');
        }

        function loadNextPage() { currentPage++; fetchContent(true); }
        function openLivePlayer(url, title) { document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; document.getElementById('playerPage').style.display = 'block'; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t) { currentType=t; currentPage=1; fetchContent(); }

        init();
    </script>
</body>
</html>
