<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SbaTa Tv | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-yellow: #facc15; --bg-dark: #050811; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        ::-webkit-scrollbar { display: none; }
        *:focus { outline: none !important; }
        *:focus-visible { outline: 3px solid var(--main-yellow) !important; outline-offset: 4px; border-radius: 10px; }

        /* الصفحات المنبثقة */
        #detailPage, #playerPage { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: none; overflow-y: auto; scroll-behavior: smooth; }
        
        /* القائمة المنسدلة */
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: #111; border: 1px solid var(--main-yellow); border-radius: 12px; min-width: 180px; z-index: 5000; overflow: hidden; }
        .group:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 12px 20px; display: block; font-size: 15px; font-weight: 800; color: #fff; text-align: right; border-bottom: 1px solid #222; cursor: pointer; }
        .dropdown-item:hover { background: var(--main-yellow); color: black; }

        /* السلايدر */
        .slider-btn { position: absolute; top: 0; bottom: 0; width: 45px; background: rgba(0,0,0,0.6); color: var(--main-yellow); display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer; opacity: 0.8; border: none; font-size: 2rem; }
        .btn-left { left: 0; border-radius: 0 15px 15px 0; } .btn-right { right: 0; border-radius: 15px 0 0 15px; }

        .movie-card { transition: 0.4s; flex-shrink: 0; width: 140px; cursor: pointer; }
        @media (min-width: 1024px) { .movie-card { width: 190px !important; } }

        .logo-tv { background: var(--main-yellow); color: black; padding: 0 8px; border-radius: 6px; margin-right: 5px; font-weight: 900; }
        .glass-nav { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }

        .video-container { position: relative; width: 100%; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; border: 2px solid var(--main-yellow); }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .cast-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid var(--main-yellow); margin: 0 auto 5px; }
        .btn-gold { background: var(--main-yellow); color: black; font-weight: 900; padding: 10px 20px; border-radius: 10px; transition: 0.3s; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-[2000] px-4 md:px-12 py-3 flex flex-col md:flex-row justify-between items-center glass-nav gap-2">
        <div class="flex items-center justify-between w-full md:w-auto gap-8">
            <div class="text-2xl md:text-3xl font-black cursor-pointer tracking-tighter shrink-0" onclick="location.reload()">SbaTa<span class="logo-tv">Tv</span></div>
            <div class="flex gap-6 items-center font-bold">
                <div class="group relative">
                    <button class="text-yellow-400 text-sm md:text-xl px-2 py-1">أفلام ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('movie', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('movie', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                    </div>
                </div>
                <div class="group relative">
                    <button class="text-gray-400 hover:text-yellow-400 text-sm md:text-xl px-2 py-1 transition">مسلسلات ▾</button>
                    <div class="dropdown-content">
                        <div onclick="changeType('tv', 'ar')" class="dropdown-item">🎬 عربية</div>
                        <div onclick="changeType('tv', 'en')" class="dropdown-item">🇺🇸 أجنبية</div>
                        <div onclick="changeType('tv', 'tr')" class="dropdown-item">🇹🇷 تركية</div>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Search Original Titles..." class="bg-white/10 border border-yellow-400/30 rounded-full px-5 py-1 text-sm outline-none focus:border-yellow-400 w-full md:w-80 text-white font-bold">
    </nav>

    <!-- الرئيسية -->
    <div id="homePage">
        <header id="mainHero" class="relative h-[60vh] md:h-[75vh] flex items-end p-8 md:p-20 pb-12 overflow-hidden text-right">
            <img id="heroImg" src="" class="absolute inset-0 w-full h-full object-cover opacity-40 transition-all">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent to-black/30"></div>
            <div class="relative z-10 max-w-4xl">
                <h1 id="heroTitle" class="text-3xl md:text-7xl font-black mb-2 uppercase italic drop-shadow-2xl text-white">...</h1>
                <p id="heroDesc" class="text-gray-300 text-sm md:text-xl mb-4 line-clamp-2 font-bold italic">...</p>
                <button id="heroPlayBtn" class="bg-yellow-400 text-black px-10 py-3 rounded-xl font-black text-lg md:text-2xl hover:scale-110 shadow-2xl">▶ WATCH NOW</button>
            </div>
        </header>

        <main class="px-4 md:px-20 pb-20 -mt-10 relative z-20">
            <div id="homeSections">
                <section class="mb-14">
                    <h2 class="text-xl md:text-3xl font-black mb-6 flex items-center gap-3 text-yellow-400 uppercase italic"><span class="w-1.5 h-8 bg-yellow-400 block shadow-[0_0_15px_#facc15]"></span> TOP PICKS</h2>
                    <div class="relative group slider-container">
                        <div id="topPicksGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth"></div>
                        <div onclick="slide('topPicksGrid', -400)" class="slider-btn btn-left">❮</div>
                        <div onclick="slide('topPicksGrid', 400)" class="slider-btn btn-right">❯</div>
                    </div>
                </section>
            </div>
            <h2 id="gridTitle" class="text-xl md:text-4xl font-black mb-10 border-r-8 border-yellow-400 pr-4 italic uppercase">Trending Now</h2>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4"></div>
            <div id="loadMoreArea" class="flex justify-center mt-20"><button onclick="loadNextPage()" class="bg-white/5 border border-yellow-400/20 text-white px-10 py-3 rounded-full font-bold hover:bg-yellow-400 hover:text-black transition">تحميل المزيد ↓</button></div>
        </main>
    </div>

    <!-- صفحة التفاصيل (رسمك اليدوي) -->
    <div id="detailPage" class="fade-in">
        <button onclick="closeDetails()" class="fixed top-20 right-6 z-[10000] btn-gold px-6 shadow-2xl">رجوع</button>
        <div id="detailDynamicContent"></div>
    </div>

    <!-- صفحة المشغل (تم ملؤها كما طلبت) -->
    <div id="playerPage" class="fade-in pb-20">
        <nav class="p-4 md:px-12 flex items-center justify-between bg-black/80 sticky top-0 z-[10000]">
            <button onclick="closePlayer()" class="btn-gold px-6 py-1 text-sm">رجوع</button>
            <h2 id="playerTitle" class="text-sm md:text-xl font-bold truncate text-white uppercase px-4 italic">...</h2>
        </nav>
        <main class="max-w-[1400px] mx-auto p-4 md:p-8">
            <div id="serverList" class="flex gap-3 mb-6 overflow-x-auto no-scrollbar font-black text-black"></div>
            <div class="video-container mb-10">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <!-- هذا هو الجزء الذي طلبته لملء الفراغ -->
            <div id="playerInfoArea" class="bg-white/5 p-6 md:p-10 rounded-[30px] border border-white/10 shadow-2xl mb-12 text-right">
                <!-- سيتم ملؤه ديناميكياً -->
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'a445c76d05e5d5697ad322b954897657';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORG = 'https://image.tmdb.org/t/p/original';
        
        let currentType = 'movie', currentPage = 1, currentLanguage = '';

        window.onscroll = () => { document.getElementById('scrollTopBtn').style.opacity = window.scrollY > 500 ? "1" : "0"; };
        function slide(id, amt) { document.getElementById(id).scrollBy({left: amt, behavior: 'smooth'}); }

        // البحث المباشر
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value;
            const homeSec = document.getElementById('homeSections');
            const hero = document.getElementById('mainHero');
            const load = document.getElementById('loadMoreArea');
            if(q.length > 2) {
                homeSec.style.display = 'none'; hero.style.display = 'none'; load.style.display = 'none';
                fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&query=${q}&language=en-US`)
                .then(r => r.json()).then(d => { displayGrid(d.results, false); document.getElementById('gridTitle').innerText = `Results: ${q.toUpperCase()}`; });
            } else if(q.length === 0) {
                homeSec.style.display = 'block'; hero.style.display = 'flex'; load.style.display = 'flex';
                document.getElementById('gridTitle').innerText = 'Trending Now'; fetchContent();
            }
        });

        async function fetchTopPicks() {
            const ids = [157018, 247885, 94997, 1399, 1396]; // Dead City is FIRST
            const grid = document.getElementById('topPicksGrid'); grid.innerHTML = '';
            for(let id of ids) {
                try {
                    const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=en-US`);
                    const item = await res.json();
                    grid.innerHTML += `<div class="movie-card group" onclick="showDetails(${item.id}, 'tv')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border-2 border-transparent hover:border-yellow-400 transition-all"></div>`;
                } catch(e) {}
            }
        }

        async function fetchContent(isAppend = false) {
            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&page=${currentPage}`;
            if(currentLanguage) url += `&with_original_language=${currentLanguage}`;
            const res = await fetch(url);
            const data = await res.json();
            displayGrid(data.results, isAppend);
            if (!isAppend && data.results[0]) updateHero(data.results[0]);
        }

        function displayGrid(items, isAppend) {
            const grid = document.getElementById('movieGrid'); if (!isAppend) grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.original_title || item.original_name || item.title;
                grid.innerHTML += `<div class="movie-card group" onclick="showDetails(${item.id}, '${currentType}')"><img src="${IMG_URL + item.poster_path}" class="rounded-xl shadow-lg border border-white/5"><h3 class="mt-3 text-[11px] font-bold truncate text-center uppercase italic opacity-80">${title}</h3></div>`;
            });
        }

        function updateHero(item) {
            document.getElementById('heroImg').src = item.backdrop_path ? IMG_ORG + item.backdrop_path : IMG_ORG + item.poster_path;
            document.getElementById('heroTitle').innerText = item.original_title || item.original_name;
            document.getElementById('heroDesc').innerText = item.overview || "Stream now on SbaTa Tv.";
            document.getElementById('heroPlayBtn').onclick = () => showDetails(item.id, currentType);
        }

        async function showDetails(id, type) {
            const resAr = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=similar,credits`);
            const dataAr = await resAr.json();
            const resEn = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dataEn = await resEn.json();
            
            document.getElementById('detailPage').style.display = 'block'; document.getElementById('detailPage').scrollTo(0,0);
            
            let seasonsHtml = '';
            if(type === 'tv' && dataAr.seasons) {
                seasonsHtml = `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 mb-16 text-right"><div class="text-right"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic">Seasons</h3><div class="flex flex-col gap-3">${dataAr.seasons.filter(s=>s.season_number > 0).map(s => `<button onclick="loadEpisodes(${id}, ${s.season_number}, '${dataEn.original_name}')" class="btn-gold">${s.name}</button>`).join('')}</div></div><div class="md:col-span-2"><h3 class="text-2xl font-black text-yellow-400 mb-6 uppercase italic">Episodes</h3><div id="epGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div></div>`;
            }

            document.getElementById('detailDynamicContent').innerHTML = `
                <div class="relative min-h-[50vh] md:min-h-[70vh] flex items-center p-8 md:p-20 overflow-hidden text-right">
                    <img src="${dataAr.backdrop_path ? IMG_ORG + dataAr.backdrop_path : ''}" class="absolute inset-0 w-full h-full object-cover opacity-30">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050811] via-transparent"></div>
                    <div class="relative z-10 flex flex-col md:flex-row gap-10 items-center w-full">
                        <img src="${IMG_URL + dataAr.poster_path}" class="w-48 md:w-72 rounded-3xl shadow-2xl border-4 border-yellow-400/20 shrink-0">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-7xl font-black mb-4 uppercase italic text-white leading-tight">${dataEn.original_title || dataEn.original_name}</h1>
                            <p class="text-gray-200 text-sm md:text-2xl leading-relaxed italic mb-10 border-r-4 border-yellow-400 pr-6">${dataAr.overview || "القصة غير متوفرة."}</p>
                            <button onclick="setupServers(${id}, ${type==='tv'?'1':'null'}, ${type==='tv'?'1':'null'}, '${dataEn.original_title || dataEn.original_name}', '${dataAr.overview}')" class="btn-gold px-12 py-3 text-xl shadow-xl">▶ شاهد الآن</button>
                        </div>
                    </div>
                </div>
                <div class="px-8 md:px-24 mt-10 text-right">
                    ${seasonsHtml}
                    <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase italic">Top Cast</h3>
                    <div class="flex gap-6 overflow-x-auto no-scrollbar mb-16">${dataAr.credits.cast.slice(0,10).map(c => `<div class="cast-item"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto shadow-xl"><p class="text-[10px] mt-2 font-bold uppercase">${c.name}</p></div>`).join('')}</div>
                    <h3 class="text-2xl font-black mb-8 text-yellow-400 uppercase tracking-widest">Recommended</h3>
                    <div class="grid grid-cols-2 md:grid-cols-6 lg:grid-cols-8 gap-4 pb-24">${dataAr.similar.results.slice(0,16).map(s => `<div class="movie-card group" onclick="showDetails(${s.id}, '${type}')"><img src="${IMG_URL+s.poster_path}" class="rounded-xl shadow-lg border border-white/10 hover:border-yellow-400 transition-all"></div>`).join('')}</div>
                </div>
            `;
            if(type === 'tv') loadEpisodes(id, dataAr.seasons[dataAr.seasons.length-1].season_number, dataEn.original_name);
        }

        async function loadEpisodes(tvId, sNum, tvName) {
            const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${sNum}?api_key=${API_KEY}&language=en-US`);
            const data = await res.json();
            document.getElementById('epGrid').innerHTML = data.episodes.map(ep => `<div class="movie-card w-full" onclick="setupServers(${tvId}, ${sNum}, ${ep.episode_number}, '${tvName} - EP ${ep.episode_number}', '${ep.overview}')"><img src="${ep.still_path ? IMG_URL+ep.still_path : 'https://via.placeholder.com/500x281'}" class="rounded-xl aspect-video object-cover shadow-lg border border-white/5 hover:border-yellow-400 transition-all"><h4 class="mt-2 text-[10px] font-bold text-center">EP ${ep.episode_number}</h4></div>`).join('');
        }

        async function setupServers(id, s, e, title, desc) {
            const list = document.getElementById('serverList'); list.innerHTML = '';
            const isTV = s !== null;
            const svs = [{n:'S1 (VIP)', u: isTV ? `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&epi=${e}` : `https://vidsrc.me/embed/movie?tmdb=${id}`}, {n:'S2 (HD)', u: isTV ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`}];
            svs.forEach((v, i) => {
                const b = document.createElement('button'); b.className = `btn-gold ${i===0?'active' : ''} text-sm px-8 py-2`; b.innerText = v.n;
                b.onclick = (event) => { document.querySelectorAll('.server-btn').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); document.getElementById('videoPlayer').src = v.u; };
                list.appendChild(b);
            });
            
            // ملء بيانات المشغل (هذا هو طلبك الأساسي)
            const type = isTV ? 'tv' : 'movie';
            const extraRes = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits,similar`);
            const extra = await extraRes.json();
            
            document.getElementById('playerInfoArea').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl md:text-5xl font-black italic uppercase text-yellow-400">${title}</h1>
                    <div class="bg-yellow-400 text-black px-4 py-1 rounded-lg font-black text-xl shadow-[0_0_15px_#facc15]">⭐ ${(extra.vote_average || 8.0).toFixed(1)}</div>
                </div>
                <p class="text-gray-200 text-sm md:text-xl leading-relaxed italic font-bold border-r-4 border-yellow-400 pr-6 mb-10">${desc || "مشاهدة ممتعة على SbaTa Tv."}</p>
                <h3 class="text-xl font-black mb-6 text-yellow-400 uppercase italic">Cast</h3>
                <div class="flex gap-4 overflow-x-auto no-scrollbar mb-10">${extra.credits.cast.slice(0,8).map(c => `<div class="cast-item"><img src="${c.profile_path?IMG_URL+c.profile_path:'https://via.placeholder.com/100'}" class="cast-img mx-auto shadow-xl"><p class="text-[9px] font-bold uppercase">${c.name}</p></div>`).join('')}</div>
                <h3 class="text-xl font-black mb-6 text-yellow-400 uppercase italic">More Like This</h3>
                <div class="grid grid-cols-3 md:grid-cols-8 gap-4">${extra.similar.results.slice(0,16).map(s => `<div class="movie-card group" onclick="closePlayer(); setTimeout(()=>showDetails(${s.id}, '${type}'),100)"><img src="${IMG_URL+s.poster_path}" class="rounded-xl shadow-lg"></div>`).join('')}</div>
            `;
            openPlayer(svs[0].u, title);
        }

        function openPlayer(url, title) { document.getElementById('playerPage').style.display = 'block'; document.getElementById('videoPlayer').src = url; document.getElementById('playerTitle').innerText = title; document.body.style.overflow = 'hidden'; }
        function closePlayer() { document.getElementById('playerPage').style.display='none'; document.getElementById('videoPlayer').src=''; document.body.style.overflow = 'auto'; }
        function closeDetails() { document.getElementById('detailPage').style.display='none'; document.body.style.overflow = 'auto'; }
        function changeType(t, l) { currentType=t; currentPage=1; fetchContent(); }
        function loadNextPage() { currentPage++; fetchContent(true); }

        fetchTopPicks(); fetchContent();
    </script>
</body>
</html>
